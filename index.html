<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PersonalHomeTrainer</title>
<style>
:root{
  --bg:#0f1319; --surface:#1c2430; --surface2:#273140; --line:#39455a;
  --text:#f2eee4; --dim:#c7d2e4;
  --neonO:#ffb033; --neonG:#3dffa2; --neonB:#5fd0ff;
  --red:#d9534a; --blue:#4a7fd4; --green:#57a06a; --amber:#efa33a;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:16px; line-height:1.5;
}
header{
  padding:14px 16px 10px; display:flex; align-items:baseline; gap:10px;
  border-bottom:1px solid var(--line);
  padding-top:calc(14px + env(safe-area-inset-top));
}
header h1{font-size:20px; font-weight:800; letter-spacing:.05em; text-transform:uppercase;
  color:var(--neonO); text-shadow:0 0 7px rgba(255,166,38,.85), 0 0 22px rgba(255,140,0,.45)}
header h1 span{color:#ffd97a; text-shadow:0 0 7px rgba(255,214,110,.9), 0 0 24px rgba(255,170,30,.5)}
#errbar{
  background:#7a1f18; color:#ffd9d4; font-size:13px; padding:8px 14px;
  border-bottom:1px solid #a33; word-break:break-all;
}
.animbox video, .animbox img{width:100%; display:block; background:#fff}
.edbpanel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px}
.edbpanel input{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:8px;
}
.edbrow{display:flex; gap:8px}
.edbrow button{
  flex:1; padding:11px; border-radius:10px; border:none; font-weight:800; font-size:13.5px; cursor:pointer;
}
.edbrow .go{background:var(--amber); color:#231a08}
.edbrow .cl{background:none; color:var(--dim); border:1px solid var(--line)}
#edb-log{margin-top:10px; font-size:13.5px; line-height:1.7; color:#cdd8ea; max-height:180px; overflow-y:auto}
#edb-log .ok{color:#7fe08a} #edb-log .no{color:#ff8d80}
.animbox .animhost{min-height:120px}
main{
  padding:14px 14px calc(92px + env(safe-area-inset-bottom));
  max-width:640px; margin:0 auto;
}
.hidden{display:none !important}
.eyebrow{
  font-size:13px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:var(--neonG); text-shadow:0 0 6px rgba(61,255,162,.55), 0 0 16px rgba(40,220,140,.3);
  margin:18px 2px 8px;
}
.daycard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:12px; overflow:hidden;
}
.daycard .dayhead{display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer}
.plate{width:26px; height:26px; border-radius:50%; flex:none; border:5px solid; background:var(--bg)}
.dayhead .t{flex:1; min-width:0}
.dayhead .t b{font-size:16.5px; display:block}
.dayhead .t small{color:#cdd8ea; font-size:13px}
.dayhead .chev{color:var(--dim); transition:transform .2s; font-size:18px}
.daycard.open .chev{transform:rotate(90deg)}
.daycard .exlist{display:none; border-top:1px solid var(--line)}
.daycard.open .exlist{display:block}
.exrow{
  display:flex; align-items:center; gap:10px; padding:11px 14px;
  border-bottom:1px solid var(--line); cursor:pointer;
}
.exrow:last-child{border-bottom:none}
.exrow:active{background:var(--surface2)}
.exrow .bar{width:4px; align-self:stretch; border-radius:2px; flex:none}
.exrow .n{flex:1; min-width:0}
.exrow .n b{display:block; font-size:15.5px}
.exrow .n small{color:#cdd8ea; font-size:13px}
.exrow .sr{font-size:13.5px; color:var(--neonB); text-shadow:0 0 6px rgba(95,208,255,.45); font-variant-numeric:tabular-nums; flex:none}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--dim);
  border-radius:999px; padding:7px 14px; font-size:14px; font-weight:700; cursor:pointer;
}
.chip.on{background:var(--neonB); color:#03222f; border-color:var(--neonB); box-shadow:0 0 10px rgba(95,208,255,.55)}

/* ---- şablon kartı düğmeleri / editör ---- */
.tplbtns{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}
.tplbtns button{
  flex:1; background:none; border:1px solid var(--line); color:var(--dim);
  border-radius:8px; padding:8px 4px; font-size:12px; font-weight:700; cursor:pointer;
}
.tplbtns button.warn{color:var(--red); border-color:rgba(217,83,74,.5)}
.pickrow{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
  background:var(--surface); cursor:pointer;
}
.pickrow.sel{border-color:var(--amber)}
.pickrow .n{flex:1; min-width:0}
.pickrow .n b{font-size:14.5px; display:block}
.pickrow .n small{color:#cdd8ea; font-size:12.5px}
.pickrow .mini{
  width:46px; background:var(--bg); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:7px 4px; font-size:14px; font-weight:700; text-align:center; flex:none;
}
.pickrow .x{color:var(--dim); font-size:11.5px; font-weight:700; flex:none}
.setbtns{display:flex; gap:10px; margin-bottom:10px}
.setbtns .btn{flex:1 1 0; padding:16px 8px; font-size:14.5px; line-height:1.3; min-height:64px}
.searchbox input{
  width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
  border-radius:12px; padding:12px 14px; font-size:16px; font-weight:600;
}
.searchbox input:focus{outline:none; border-color:var(--neonB); box-shadow:0 0 10px rgba(95,208,255,.35)}
.searchbox input::placeholder{color:#93a2ba}
.mselbar{display:flex; align-items:center; gap:8px; margin:4px 2px 10px; font-size:15px}
.mselbar b{color:var(--neonB); text-shadow:0 0 6px rgba(95,208,255,.4)}
.mapcards .mcard{max-width:240px}
.mapcards [data-m]{cursor:pointer}

/* ---- 3D animasyon kutusu ---- */
.animbox{
  background:linear-gradient(180deg, #232e3e 0%, #1a2230 58%, #131922 100%);
  border:1px solid var(--line); border-radius:var(--radius);
  padding:0; margin-bottom:12px; position:relative; overflow:hidden;
}
.animbox canvas{width:100%; height:auto; display:block; border-radius:var(--radius)}
.ov-view{
  position:absolute; top:10px; color:var(--neonB); text-shadow:0 0 8px rgba(95,208,255,.6); font-size:13px; font-weight:800;
  letter-spacing:.22em; background:rgba(10,14,20,.55); padding:4px 12px; border-radius:999px;
  pointer-events:none;
}
.ov-view.l{left:12px} .ov-view.r{right:12px}
.ov-cue{
  position:absolute; top:38px; left:0; right:0; text-align:center; pointer-events:none;
  font-size:52px; font-weight:900; letter-spacing:.08em; color:#fff;
  text-shadow:0 3px 18px rgba(0,0,0,.9), 0 0 42px rgba(0,0,0,.6);
  line-height:1;
}
.ov-cue.c-down{color:#6db2ff} .ov-cue.c-hold{color:#ffc14d}
.ov-cue.c-up{color:#7fe08a} .ov-cue.c-ready{color:#ff5f4d; animation:pulseCue .8s infinite}
@keyframes pulseCue{50%{transform:scale(1.12)}}
.mcards{display:flex; gap:12px; justify-content:center; margin-bottom:12px}
.mcard{
  background:#f2f4f7; border:1px solid #d5dae2; border-radius:14px;
  padding:8px 10px 6px; text-align:center; flex:1; max-width:190px;
}
.mcard svg{width:100%; max-width:160px; height:auto; display:block; margin:0 auto}
.mcard .mlbl{font-size:11px; font-weight:800; letter-spacing:.22em; color:#5b6572; margin-bottom:4px}
.mapcards .mcard svg{max-width:220px}
.ov-rep{
  position:absolute; bottom:12px; left:0; right:0; text-align:center; pointer-events:none;
  font-size:44px; font-weight:900; font-variant-numeric:tabular-nums; color:#fff;
  text-shadow:0 3px 16px rgba(0,0,0,.9);
}
.animctl{display:flex; justify-content:center; gap:8px; padding:6px 0 4px}
.animctl button{
  background:var(--bg); color:var(--dim); border:1px solid var(--line);
  border-radius:8px; padding:5px 14px; font-size:12px; font-weight:700; cursor:pointer;
}
.animctl button.on{color:var(--amber); border-color:var(--amber)}

/* ---- detay sheet ---- */
.sheet-bg{position:fixed; inset:0; background:rgba(6,9,14,.72); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{
  background:var(--surface); width:100%; max-width:640px; border-radius:20px 20px 0 0;
  max-height:92vh; max-height:92dvh; overflow-y:auto;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  border:1px solid var(--line); border-bottom:none;
}
.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:19px; font-weight:800}
.sheet .meta{color:#cdd8ea; font-size:14px; margin:2px 0 10px}
.mchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.mchip{font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:999px; background:var(--surface2)}
.tips h3{font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--neonG); text-shadow:0 0 6px rgba(61,255,162,.5); margin:14px 0 8px}
.tips ul{list-style:none}
.tips li{padding:8px 0 8px 26px; position:relative; border-bottom:1px dashed var(--line); font-size:15px}
.tips li:before{content:"›"; position:absolute; left:6px; top:6px; color:var(--amber); font-weight:800; font-size:16px}
.mistake{
  margin-top:14px; background:rgba(217,83,74,.12); border:1px solid rgba(217,83,74,.45);
  border-radius:var(--radius); padding:11px 13px; font-size:14.5px;
}
.mistake b{color:var(--red); display:block; font-size:11.5px; letter-spacing:.1em; text-transform:uppercase; margin-bottom:3px}

/* ---- antrenman oynatıcı ---- */
.player-head{display:flex; align-items:baseline; gap:8px; margin-bottom:8px}
.player-head b{font-size:21px; flex:1}
.player-head .setinfo{color:var(--text); font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}

.pbar{height:6px; border-radius:3px; background:var(--surface2); overflow:hidden; margin:10px 0 14px}
.pbar > div{height:100%; width:0%; background:var(--amber); border-radius:3px; transition:width .2s linear}
.pctl{display:flex; gap:10px}
.btn{
  flex:1; padding:14px; border-radius:12px; border:none; font-weight:800; font-size:15px;
  cursor:pointer; letter-spacing:.02em;
}
.btn.primary{background:var(--amber); color:#231a08}
.btn.ghost{background:var(--surface); color:var(--text); border:1px solid var(--line)}
.btn.danger{background:none; color:var(--red); border:1px solid rgba(217,83,74,.5)}
.btn.small{flex:none; padding:14px 18px}
.restpanel{text-align:center; padding:6px 0}
.restpanel .rt{font-size:52px; font-weight:800; color:var(--amber); font-variant-numeric:tabular-nums}
.restpanel .nx{color:var(--dim); font-size:14px; margin-top:2px}
.startbig{
  width:100%; margin-top:4px; padding:15px; border-radius:12px; border:none;
  font-weight:800; font-size:16px; letter-spacing:.04em; cursor:pointer; color:#231a08;
}
.hint{color:#cdd8ea; font-size:15px; margin-top:10px; text-align:center}

.prepbox{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:12px}
.prepbox label{display:block; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--neonG); text-shadow:0 0 6px rgba(61,255,162,.5); margin-bottom:6px}
.prepbox input{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:10px; padding:11px 12px; font-size:15px; font-weight:700}
.prepbox input:focus{outline:none; border-color:var(--amber)}
.prepbox .prevref{margin-top:8px; font-size:13px; color:var(--dim)}
.prepbox .prevref b{color:var(--amber)}

/* ---- geçmiş ---- */
.hcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:10px}
.hcard .hd{display:flex; justify-content:space-between; align-items:baseline}
.hcard .hd b{font-size:14.5px}
.hcard .hd small{color:var(--dim)}
.hcard .st{color:#cdd8ea; font-size:14px; margin-top:3px}
.empty{color:#cdd8ea; text-align:center; padding:40px 20px; font-size:15px}

/* ---- nav ---- */
nav{
  position:fixed; bottom:0; left:0; right:0; z-index:30;
  background:var(--surface); border-top:1px solid var(--line);
  display:flex; padding-bottom:env(safe-area-inset-bottom);
}
nav button{
  flex:1; background:none; border:none; color:var(--dim); padding:9px 0 7px;
  font-size:11.5px; font-weight:800; letter-spacing:.05em; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:3px;
}
nav button svg{width:22px; height:22px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round}
nav button.on{color:var(--neonO); text-shadow:0 0 8px rgba(255,166,38,.8)}

/* ---- iPad / geniş ekran ölçekleme ---- */
@media (min-width:700px){
  main{max-width:760px}
  .mcard{max-width:210px}
  .mapcards .mcard{max-width:290px}
  .sheet{max-width:760px}
}
</style>
</head>
<body>
<header>
  <h1>Personal<span>Home</span>Trainer</h1>
</header>
<div id="errbar" class="hidden"></div>
<main>
  <section id="view-program"></section>
  <section id="view-library" class="hidden"></section>
  <section id="view-workout" class="hidden"></section>
  <section id="view-history" class="hidden"></section>
  <section id="view-settings" class="hidden"></section>
</main>
<div id="sheet-root"></div>
<nav>
  <button id="nav-program" class="on">
    <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Program
  </button>
  <button id="nav-library">
    <svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="12" r="2.5"/><path d="M8.5 12h7"/></svg>Hareketler
  </button>
  <button id="nav-workout">
    <svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg>Antrenman
  </button>
  <button id="nav-history">
    <svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 16v-5M13 16V8M18 16v-3"/></svg>Geçmiş
  </button>
  <button id="nav-settings">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h0a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h0a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v0a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>Ayarlar
  </button>
</nav>
<script>
"use strict";
/* Cihazda oluşan hataları ekranda göster — teşhis için */
window.addEventListener("error", e=>{
  const bar = document.getElementById("errbar");
  if(bar){ bar.classList.remove("hidden");
    bar.textContent = "Hata: " + e.message + " @" + (e.lineno||"?"); }
});
/* ================= GÜVENLİ DEPOLAMA ================= */
const store = {
  mem:{},
  get(k){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):null }catch(e){ return this.mem[k]||null } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){ this.mem[k]=v } }
};

/* ================= POZ SİSTEMİ =================
   Koordinatlar 2D yan görünüş tabanlı [x,y] veya tam 3B [x,y,z].
   tempo:[AdanB, B'de bekle, BdenA, A'da bekle] ms — gerçek yapılış hızı.
   cue: 'lower' (A→B iniş) | 'lift' (A→B kaldırış) | 'flow' (akıcı) */
const STAND = {H:[118,50],N:[118,66],P:[118,130],E1:[124,96],W1:[126,120],E2:[112,96],W2:[110,120],K1:[116,170],A1:[116,210],K2:[122,170],A2:[122,210]};
function pz(o){ const p={}; for(const k in STAND) p[k]=STAND[k].slice(); for(const k in o) p[k]=o[k].slice(); return p }

/* ================= EGZERSİZ VERİSİ =================
   day:1-3 → önerilen şablonlarda yer alır. day:0 → sadece kütüphanede (alternatif). */
const EXERCISES = [

/* ---------- GÜN 1: BACAK · KALÇA · CORE ---------- */
{ id:"goblet_squat", name:"Goblet Squat", eq:["Kettlebell","Dumbbell"], day:1,
  muscles:["Quadriceps","Kalça","Core"], sets:"3 × 12-15", reps:15, rest:90,
  tempo:[2000,2000,800,400], cue:"lower",
  tips:[
    "Kettlebell'i göğsüne yakın tut, dirsekler aşağıyı göstersin.",
    "2 saniyede yavaşça in, dipte 2 saniye bekle, hızlı kalk.",
    "Dizler ayak ucunla aynı yönde açılsın, içeri çökmesin.",
    "Topuklar hareket boyunca yerde kalsın."
  ],
  mistake:"Sırtı yuvarlayıp öne kapanmak. Göğüs dik, bakış hafif yukarıda kalmalı.",
  anim:{ eqType:"kb", poses:[
    pz({E1:[131,94],W1:[130,106],E2:[128,96],W2:[129,108],Q:[130,116]}),
    pz({H:[110,92],N:[110,108],P:[102,156],E1:[124,136],W1:[124,148],E2:[121,138],W2:[122,150],K1:[128,182],A1:[116,210],K2:[134,184],A2:[122,210],Q:[123,158]})
  ]}},

{ id:"db_rdl", name:"Romanian Deadlift", eq:["Dumbbell","Kettlebell"], day:1,
  muscles:["Hamstring","Kalça","Bel"], sets:"3 × 12-15", reps:15, rest:90,
  tempo:[2000,1000,1000,400], cue:"lower",
  tips:[
    "Hareket dizden değil kalçadan başlar: kalçayı geriye it.",
    "2 saniyede in, gergin noktada 1 sn bekle, 1 saniyede kalk.",
    "Dumbbell'lar bacağa yakın, neredeyse sürtünerek insin.",
    "Sırt düz, kürek kemikleri hafif sıkılı kalsın."
  ],
  mistake:"Dizleri fazla bükerek hareketi squat'a çevirmek. Dizler sadece hafif kırık kalır.",
  anim:{ eqType:"db", poses:[
    pz({W1:[126,124],E1:[123,98],W2:[112,124],E2:[109,98]}),
    pz({H:[164,100],N:[150,108],P:[106,140],E1:[150,132],W1:[152,158],E2:[144,134],W2:[146,160],K1:[112,176],A1:[114,210],K2:[118,178],A2:[122,210]})
  ]}},

{ id:"bulgarian_split", name:"Bulgarian Split Squat", eq:["Dumbbell","Bench"], day:1,
  muscles:["Quadriceps","Kalça"], sets:"3 × 12 / bacak", reps:12, rest:90,
  tempo:[2000,600,1000,400], cue:"lower", sideNote:"Her bacak için ayrı set",
  tips:[
    "Arka ayağın üst yüzü bench'te, ağırlık öndeki bacakta olsun.",
    "2 saniyede in, dipte kısa dur, kontrollü kalk.",
    "Ön dizin ayak ucunu çok geçmesine izin verme.",
    "Yukarı kalkarken ön topuktan güç al."
  ],
  mistake:"Adımı çok kısa almak; ön diz aşırı öne gider ve denge bozulur.",
  anim:{ eqType:"db", bench:[148,176,62,34], poses:[
    pz({H:[104,50],N:[104,66],P:[104,130],E1:[110,96],W1:[112,122],E2:[97,96],W2:[99,122],K1:[102,170],A1:[102,210],K2:[128,166],A2:[160,178]}),
    pz({H:[102,86],N:[102,102],P:[100,152],E1:[108,132],W1:[110,158],E2:[95,134],W2:[97,160],K1:[120,182],A1:[102,210],K2:[128,190],A2:[160,178]})
  ]}},

{ id:"hip_thrust", name:"Hip Thrust", eq:["Bench","Dumbbell"], day:1,
  muscles:["Kalça","Hamstring"], sets:"3 × 12-15", reps:15, rest:90,
  tempo:[1000,2000,1500,300], cue:"lift",
  tips:[

/* ================= ÖNERİLEN GÜNLER ================= */
const DAYS = [
  { id:1, name:"Gün 1 — Bacak · Kalça · Core", short:"Bacak & Core", colorHex:"#d9534a",
    note:"Alt vücut hipertrofi + core stabilite" },
  { id:2, name:"Gün 2 — Üst Vücut", short:"Üst Vücut", colorHex:"#4a7fd4",
    note:"Göğüs, sırt, omuz, kol — itiş/çekiş dengeli" },
  { id:3, name:"Gün 3 — Full Body", short:"Full Body", colorHex:"#57a06a",
    note:"Bileşik hareketler: güç + kondisyon" }
];
const byDay = d => EXERCISES.filter(e => e.day === d);
const exById = id => EXERCISES.find(e => e.id === id);
const esc = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;");
const colorOf = e => (DAYS.find(d=>d.id===e.day)||{colorHex:"#efa33a"}).colorHex;

/* ================= ŞABLON SİSTEMİ =================
   Önerilen şablonlar sabittir; özel şablonlar cihazda saklanır.
   Şablon: {id, name, note, colorHex, items:[{ex, sets, reps}], builtin} */
const BUILTIN_TEMPLATES = DAYS.map(d=>({
  id:"day"+d.id, name:d.name, note:d.note, colorHex:d.colorHex, builtin:true,
  items: byDay(d.id).map(e=>({ex:e.id, sets:3, reps: e.timed ? e.timed : e.reps}))
}));
const TPL_COLORS = ["#c95f8e","#7a5fd4","#3aa7a0","#c9803a","#5f9ad4","#a3c24d"];
const pickColor = i => TPL_COLORS[i % TPL_COLORS.length];
function customTemplates(){ return store.get("pht_templates") || [] }
function saveCustomTemplates(l){ store.set("pht_templates", l) }
function allTemplates(){ return BUILTIN_TEMPLATES.concat(customTemplates()) }
function tplById(id){ return allTemplates().find(t=>t.id===id) }
const clampN = (v, lo, hi, def) => { const n = parseInt(v,10); return isNaN(n) ? def : Math.max(lo, Math.min(hi, n)) };

/* Şablonu dosya olarak dışa aktar (koç → sporcu paylaşımı) */
function exportTemplate(t){
  const data = { app:"PersonalHomeTrainer", type:"pht-template", version:1,
    template:{ name:t.name, note:t.note||"", items:t.items } };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (t.name||"sablon").replace(/[\\/:*?"<>|]/g,"").trim().replace(/\s+/g,"_") + ".pht.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
}
/* Dosyadan şablon içe aktar */
function importTemplateFile(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      const t = d && d.template ? d.template : d;
      if(!t || !t.name || !Array.isArray(t.items)) throw new Error("Şablon biçimi tanınmadı");
      const items = t.items.filter(it=>it && exById(it.ex)).map(it=>({
        ex: it.ex,
        sets: clampN(it.sets, 1, 10, 3),
        reps: clampN(it.reps, 1, 300, 12)
      }));
      const skipped = t.items.length - items.length;
      if(!items.length) throw new Error("Dosyadaki hareketler bu uygulama sürümünde bulunamadı");
      const list = customTemplates();
      list.push({ id:"c"+Date.now(), name:String(t.name).slice(0,60), note:String(t.note||"").slice(0,120),
        colorHex:pickColor(list.length), items });
      saveCustomTemplates(list);
      renderProgram();
      alert("Şablon içe aktarıldı: " + t.name + (skipped ? " ("+skipped+" hareket tanınmadı, atlandı)" : ""));
    }catch(err){ alert("İçe aktarma hatası: " + (err && err.message || err)) }
  };
  r.onerror = ()=>alert("Dosya okunamadı.");
  r.readAsText(file);
}

/* ================= 3B MOTOR =================
   Dünya: x sağ, y yukarı, z izleyiciye doğru. Zemin y=0. */
const DEF_Z = {H:0,N:0,P:0,E1:13,W1:13,E2:-13,W2:-13,K1:8,A1:8,K2:-8,A2:-8,Q:0};
function to3(p){
  const q = {};
  for(const k in p){
    const v = p[k];
    q[k] = [v[0]-120, 210-v[1], v.length>2 ? v[2] : (DEF_Z[k]||0)];
  }
  return q;
}
function lerp3(a,b,t){
  const o = {};
  for(const k in a){
    if(b[k]) o[k]=[a[k][0]+(b[k][0]-a[k][0])*t, a[k][1]+(b[k][1]-a[k][1])*t, a[k][2]+(b[k][2]-a[k][2])*t];
    else o[k]=a[k];
  }
  return o;
}
/* renk araçları */
function parseCol(c){
  if(c && c[0]==="#") return [parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  const m = /rgb\((\d+)\s*,\s*(\d+)\s*,\s*(\d+)\)/.exec(c||"");
  return m ? [ +m[1], +m[2], +m[3] ] : [200,200,200];
}
function shade(color, k){
  const [r,g,b] = parseCol(color);
  const m = 0.55 + 0.45*k;
  return `rgb(${Math.round(r*m)},${Math.round(g*m)},${Math.round(b*m)})`;
}
const COL = { skin:"#d8ae85", pants:"#4a5568", shoe:"#242b36", band:"#efa33a" };

/* tempo → faz listesi */
function buildPhases(ex){
  const [d1,h1,d2,h2] = ex.tempo;
  const cues = ex.cue==="lift" ? ["Kaldır","Sık","İndir",""] :
               ex.cue==="flow" ? ["Git","","Dön",""] :
                                 ["İn","Bekle","Kalk",""];
  const raw = [
    {dur:d1, a:0, b:1, cue:cues[0]},
    {dur:h1, a:1, b:1, cue:cues[1]},
    {dur:d2, a:1, b:0, cue:cues[2]},
    {dur:h2, a:0, b:0, cue:cues[3]}
  ].filter(p=>p.dur>0);
  raw.total = raw.reduce((s,p)=>s+p.dur,0);
  return raw;
}
function phaseAt(phases, ms){
  let acc = 0;
  for(const p of phases){
    if(ms < acc + p.dur){
      const f = (ms-acc)/p.dur;
      const e = p.a===p.b ? 0 : (1-Math.cos(f*Math.PI))/2;
      return { t: p.a + (p.b-p.a)*e, cue: p.cue };
    }
    acc += p.dur;
  }
  return { t: phases[phases.length-1].b, cue:"" };
}

/* Kas → vücut parçası eşlemesi (kas vurgulu manken için) */
function hlParts(ex){
  const s = new Set();
  for(const m of ex.muscles){
    if(/Quadriceps|Hamstring|Bacak/.test(m)){ s.add("thighL"); s.add("thighR") }
    if(/Baldır/.test(m)){ s.add("shinL"); s.add("shinR") }
    if(/Kalça/.test(m)) s.add("glute");
    if(/Core|Oblik|karın|Bel/.test(m)) s.add("lower");
    if(/Göğüs|Serratus|Sırt|Lat|Trapez/.test(m)) s.add("upper");
    if(/omuz|Rotator/i.test(m)){ s.add("deltL"); s.add("deltR") }
    if(/Biceps|Triceps/.test(m)){ s.add("armL"); s.add("armR") }
    if(/Ön kol|Kavrama/.test(m)){ s.add("foreL"); s.add("foreR") }
  }
  return s;
}

/* ---- hareket yayı ---- */
function computeArc(ex){
  const pA = to3(ex.anim.poses[0]), pB = to3(ex.anim.poses[1]);
  const d3 = (a,b)=>Math.hypot(a[0]-b[0], a[1]-b[1], a[2]-b[2]);
  const cands = ["Q","W1","W2","A1","A2","H"];
  let key=null, bd=0;
  for(const k of cands){
    if(pA[k] && pB[k]){ const d = d3(pA[k], pB[k]); if(d > bd){ bd = d; key = k } }
  }
  if(bd < 14) return null;
  const pivKey = (key==="A1"||key==="A2") ? "P" : (key==="H") ? null : "N";
  const pts = [];
  if(!pivKey){
    for(let i=0;i<=24;i++) pts.push(lerp3(pA,pB,i/24)[key]);
    return { key, pts, pivKey };
  }
  const vA = pA[key].map((v,ix)=>v-pA[pivKey][ix]);
  const vB = pB[key].map((v,ix)=>v-pB[pivKey][ix]);
  const useZ = Math.abs(vB[2]-vA[2]) > Math.abs(vB[0]-vA[0]);
  const h = v => useZ ? v[2] : v[0];
  const aA = Math.atan2(vA[1], h(vA)), aB = Math.atan2(vB[1], h(vB));
  let dA = aB - aA;
  if(dA >  Math.PI) dA -= 2*Math.PI;
  if(dA < -Math.PI) dA += 2*Math.PI;
  const lA = Math.hypot(h(vA), vA[1]), lB = Math.hypot(h(vB), vB[1]);
  const oA = useZ ? vA[0] : vA[2],     oB = useZ ? vB[0] : vB[2];
  for(let i=0;i<=24;i++){
    const t = i/24;
    const piv = lerp3(pA,pB,t)[pivKey];
    const a = aA + dA*t, l = lA + (lB-lA)*t, o = oA + (oB-oA)*t;
    const hv = Math.cos(a)*l, yv = Math.sin(a)*l;
    pts.push(useZ ? [piv[0]+o, piv[1]+yv, piv[2]+hv] : [piv[0]+hv, piv[1]+yv, piv[2]+o]);
  }
  return { key, pts, pivKey };
}

class Anim3D {
  constructor(canvas, ex, opts){
    this.cv = canvas; this.ctx = canvas.getContext("2d");
    this.ex = ex; this.opts = opts || {};
    this.pA = to3(ex.anim.poses[0]); this.pB = to3(ex.anim.poses[1]);
    this.t = 0; this.dir = 1;
    this.dayColor = colorOf(ex);
    this.hl = hlParts(ex);
    this.arc = computeArc(ex);
    this.phases = buildPhases(ex);
    this.selfDrive = false; this.startTs = 0; this.paused = false;
    this.raf = 0; this.speed = 1;
    this._loop = this._loop.bind(this);
    this.raf = requestAnimationFrame(this._loop);
  }
  drive(speed){ this.selfDrive = true; if(speed) this.speed = speed; this.startTs = performance.now() }
  setT(t){ if(t > this.t + 1e-4) this.dir = 1; else if(t < this.t - 1e-4) this.dir = -1; this.t = t }
  _loop(now){
    if(this.selfDrive && !this.paused){
      const ms = ((now - this.startTs) * this.speed) % this.phases.total;
      const ph = phaseAt(this.phases, ms);
      this.setT(ph.t);
      if(this.opts.cueEl) setCue(this.opts.cueEl, ph.cue);
    }
    try{ this.render(now) }
    catch(err){
      const bar = document.getElementById("errbar");
      if(bar){ bar.classList.remove("hidden");
        bar.textContent = "Çizim hatası: " + (err && err.message || err) }
    }
    this.raf = requestAnimationFrame(this._loop);
  }
  destroy(){ cancelAnimationFrame(this.raf) }

  render(now){
    const ctx = this.ctx, W = this.cv.width, H = this.cv.height;
    ctx.clearRect(0,0,W,H);
    const P3 = lerp3(this.pA, this.pB, this.t);
    const pulse = (Math.sin((now||performance.now())/260)+1)/2;
    const half = W/2;
    const views = [ {ang:-0.22}, {ang:Math.PI/2 + 0.18} ];
    views.forEach((vw,idx)=>{
      ctx.save();
      ctx.beginPath(); ctx.rect(idx*half, 0, half, H); ctx.clip();
      ctx.translate(idx*half, 0);
      this.renderView(P3, pulse, vw.ang, half, H);
      ctx.restore();
    });
    ctx.strokeStyle = "rgba(160,176,200,.28)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(half, 12); ctx.lineTo(half, H-12); ctx.stroke();
  }

  project(pt, ang, W, H){
    const ca = Math.cos(ang), sa = Math.sin(ang);
    const xr = pt[0]*ca + pt[2]*sa;
    const zr = -pt[0]*sa + pt[2]*ca;
    const f = 620, s = f/(f - zr);
    const K = 1.55;
    return { x: W/2 + xr*s*K, y: H - 36 - pt[1]*s*K, s, zr, r: s*K };
  }

  _offsets(pts){
    const n = pts.length, L = [], R = [];
    for(let i=0;i<n;i++){
      const a = pts[Math.max(0,i-1)], b = pts[Math.min(n-1,i+1)];
      let dx = b.x-a.x, dy = b.y-a.y;
      const len = Math.hypot(dx,dy)||1; dx/=len; dy/=len;
      L.push({x:pts[i].x - dy*pts[i].R, y:pts[i].y + dx*pts[i].R});
      R.push({x:pts[i].x + dy*pts[i].R, y:pts[i].y - dx*pts[i].R});
    }
    return {L,R};
  }
  _smoothTo(side){
    const ctx = this.ctx, n = side.length;
    for(let i=1;i<n-1;i++){
      const mx=(side[i].x+side[i+1].x)/2, my=(side[i].y+side[i+1].y)/2;
      ctx.quadraticCurveTo(side[i].x, side[i].y, mx, my);
    }
    ctx.lineTo(side[n-1].x, side[n-1].y);
  }
  limbShape(joints, color){
    const ctx = this.ctx;
    const {L,R} = this._offsets(joints);
    const p0 = joints[0], pn = joints[joints.length-1];
    const a0 = Math.atan2(joints[1].y-p0.y, joints[1].x-p0.x);
    const an = Math.atan2(pn.y-joints[joints.length-2].y, pn.x-joints[joints.length-2].x);
    ctx.beginPath();
    ctx.arc(p0.x, p0.y, p0.R, a0+Math.PI/2, a0-Math.PI/2);
    this._smoothTo(R);
    ctx.arc(pn.x, pn.y, pn.R, an-Math.PI/2, an+Math.PI/2);
    const Lr = L.slice().reverse();
    this._smoothTo(Lr);
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = "rgba(12,17,25,.55)"; ctx.lineWidth = 1.6; ctx.stroke();
  }
  blob(pts, color){
    const ctx = this.ctx, n = pts.length;
    ctx.beginPath();
    ctx.moveTo((pts[0].x+pts[1].x)/2, (pts[0].y+pts[1].y)/2);
    for(let i=1;i<=n;i++){
      const p = pts[i%n], q = pts[(i+1)%n];
      ctx.quadraticCurveTo(p.x, p.y, (p.x+q.x)/2, (p.y+q.y)/2);
    }
    ctx.closePath();
    ctx.fillStyle = color; ctx.fill();
    ctx.strokeStyle = "rgba(12,17,25,.5)"; ctx.lineWidth = 1.5; ctx.stroke();
  }
  sphere(p, r, color, noline){
    const ctx = this.ctx, R = Math.max(0.1, r*p.r);
    const g = ctx.createRadialGradient(p.x-R*0.35, p.y-R*0.4, R*0.12, p.x, p.y, R);
    g.addColorStop(0, shade(color, 1)); g.addColorStop(1, shade(color, 0.4));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7); ctx.fill();
    if(!noline){ ctx.strokeStyle = "rgba(12,17,25,.5)"; ctx.lineWidth = 1.3; ctx.stroke() }
  }
  joint(p, r){
    const ctx = this.ctx, R = Math.max(0.1, r*p.r);
    ctx.beginPath(); ctx.arc(p.x, p.y, R, 0, 7);
    ctx.fillStyle = "rgba(16,21,30,.85)"; ctx.fill();
    ctx.strokeStyle = "rgba(240,245,252,.8)"; ctx.lineWidth = 1.1; ctx.stroke();
  }
  drawArc(pjp){
    if(!this.arc) return;
    const ctx = this.ctx;
    const towardB = this.dir >= 0;
    const ecc = this.ex.cue === "lower";
    const col = this.ex.cue === "flow" ? "239,163,58" :
                (towardB === ecc) ? "224,73,58" : "88,205,120";
    const pts = this.arc.pts.map(pjp);
    if(this.arc.pivKey){
      const piv = pjp(lerp3(this.pA, this.pB, this.t)[this.arc.pivKey]);
      ctx.beginPath();
      ctx.moveTo(piv.x, piv.y);
      pts.forEach(p=>ctx.lineTo(p.x, p.y));
      ctx.closePath();
      ctx.fillStyle = `rgba(${col},.16)`; ctx.fill();
    }
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const stroke = (w, style)=>{
      ctx.strokeStyle = style; ctx.lineWidth = w;
      ctx.beginPath(); pts.forEach((p,ix)=> ix?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)); ctx.stroke();
    };
    stroke(9, `rgba(${col},.22)`);
    stroke(4.5, `rgba(${col},.8)`);
    stroke(1.6, "rgba(255,255,255,.95)");
    const cur = pts[Math.max(0, Math.min(24, Math.round(this.t*24)))];
    ctx.fillStyle = "#fff";
    ctx.beginPath(); ctx.arc(cur.x, cur.y, 4.5, 0, 7); ctx.fill();
    ctx.strokeStyle = `rgba(${col},.9)`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cur.x, cur.y, 7, 0, 7); ctx.stroke();
  }

  renderView(P3, pulse, ang, W, H){
    const ctx = this.ctx;
    const pjp = pt => this.project(pt, ang, W, H);
    const pj = k => pjp(P3[k]);
    const zk = zr => Math.max(0, Math.min(1, (zr+90)/180));
    const NEU = "#e2e7f0", SHORTS = "#2a3140";
    const musCol = k => {
      const r = Math.round(212 + (255-212)*pulse);
      const g = Math.round(60  + (110-60)*pulse);
      const b = Math.round(40  + (70-40)*pulse);
      const m = 0.62 + 0.38*k;
      return `rgb(${Math.round(r*m)},${Math.round(g*m)},${Math.round(b*m)})`;
    };
    const colFor = (part, k) =>
      part==="shorts" ? shade(SHORTS, k) :
      (part && this.hl.has(part)) ? musCol(k) : shade(NEU, k);

    /* zemin */
    ctx.strokeStyle = "rgba(140,158,185,.18)"; ctx.lineWidth = 1;
    for(let i=-2;i<=2;i++){
      let a = pjp([-95, 0, i*38]), b = pjp([95, 0, i*38]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
      a = pjp([i*38, 0, -85]); b = pjp([i*38, 0, 85]);
      ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y); ctx.stroke();
    }
    const shp = pjp([P3.P[0], 0, P3.P[2]]);
    ctx.fillStyle = "rgba(0,0,0,.42)";
    ctx.beginPath(); ctx.ellipse(shp.x, shp.y, 36*shp.r, 8*shp.r, 0, 0, 7); ctx.fill();

    this.drawArc(pjp);

    const parts = [];

    if(this.ex.anim.bench){
      const [bx,by,bw,bh] = this.ex.anim.bench;
      const x0=bx-120, x1=bx+bw-120, y0=210-(by+bh), y1=210-by, zd=26;
      const c = (x,y,z)=>pjp([x,y,z]);
      const face = (pts, fill)=>{
        ctx.beginPath();
        ctx.moveTo(pts[0].x,pts[0].y);
        pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
        ctx.closePath(); ctx.fillStyle = fill; ctx.fill();
        ctx.strokeStyle = "rgba(12,17,25,.4)"; ctx.lineWidth = 1.2; ctx.stroke();
      };
      const top = [c(x0,y1,zd),c(x1,y1,zd),c(x1,y1,-zd),c(x0,y1,-zd)];
      const zc = (top[0].zr+top[2].zr)/2;
      parts.push({ z: zc-40, draw: ()=>{
        const zs = Math.sin(ang) >= 0 ? zd : -zd;
        face([c(x0,y0,zs),c(x1,y0,zs),c(x1,y1,zs),c(x0,y1,zs)], shade("#46536a", 0.5));
        const xs = Math.cos(ang) >= 0 ? x1 : x0;
        face([c(xs,y0,-zd),c(xs,y0,zd),c(xs,y1,zd),c(xs,y1,-zd)], shade("#46536a", 0.36));
        face(top, shade("#5a6b85", 0.88));
      }});
    }

    /* iskelet */
    const nx = P3.N[0], ny = P3.N[1], nz = P3.N[2];
    const px = P3.P[0], py = P3.P[1], pzv = P3.P[2];
    const mixv = t => [nx+(px-nx)*t, ny+(py-ny)*t, nz+(pzv-nz)*t];
    const wPt = mixv(0.64), cPt = mixv(0.2);
    const N=pj("N"), H3=pj("H");
    const SL=pjp([nx,ny-2,nz+13]), SR=pjp([nx,ny-2,nz-13]);
    const WLp=pjp([wPt[0],wPt[1],wPt[2]+8.5]), WRp=pjp([wPt[0],wPt[1],wPt[2]-8.5]);
    const HLp=pjp([px,py+1,pzv+9.5]), HRp=pjp([px,py+1,pzv-9.5]);
    const PecL=pjp([cPt[0],cPt[1],cPt[2]+6.5]), PecR=pjp([cPt[0],cPt[1],cPt[2]-6.5]);
    const GlL=pjp([px,py+2,pzv+5]), GlR=pjp([px,py+2,pzv-5]);
    const E1=pj("E1"),W1=pj("W1"),E2=pj("E2"),W2=pj("W2");
    const K1=pj("K1"),A1=pj("A1"),K2=pj("K2"),A2=pj("A2");

    const J = (p, R) => ({x:p.x, y:p.y, R:R*p.r, zr:p.zr});
    const mid = (a,b,f,R)=>({x:a.x+(b.x-a.x)*f, y:a.y+(b.y-a.y)*f, R:R*((a.r+b.r)/2), zr:(a.zr+b.zr)/2});
    const zAvg = js => js.reduce((s,x)=>s+x.zr,0)/js.length;
    const limb = (js, part)=> parts.push({ z: zAvg(js),
      draw: ()=> this.limbShape(js, colFor(part, zk(zAvg(js)))) });
    const jointAt = (p,r)=> parts.push({ z:p.zr+0.6, draw:()=>this.joint(p, r) });

    const torsoPts = [J(SL,1), J(SR,1), J(WRp,1), J(HRp,1), J(HLp,1), J(WLp,1)];
    parts.push({ z: zAvg([SL,SR,HLp,HRp].map(p=>({zr:p.zr}))), draw: ()=>{
      this.blob(torsoPts, colFor("upper", zk((SL.zr+SR.zr+HLp.zr+HRp.zr)/4)));
      this.blob([J(WLp,1), J(WRp,1), J(HRp,1), J(HLp,1)], colFor("lower", zk((WLp.zr+WRp.zr+HLp.zr+HRp.zr)/4)));
    }});
    parts.push({ z:PecL.zr+0.2, draw: ()=>this.sphere(PecL, 4.4, this.hl.has("upper")?musCol(zk(PecL.zr)):NEU, true) });
    parts.push({ z:PecR.zr+0.2, draw: ()=>this.sphere(PecR, 4.4, this.hl.has("upper")?musCol(zk(PecR.zr)):NEU, true) });
    parts.push({ z:(GlL.zr+GlR.zr)/2+0.1, draw: ()=>{
      const gc = this.hl.has("glute") ? musCol(zk(GlL.zr)) : SHORTS;
      this.sphere(GlL, 5.2, gc, true); this.sphere(GlR, 5.2, gc, true);
    }});
    parts.push({ z:SL.zr+0.1, draw: ()=>this.sphere(SL, 5.8, this.hl.has("deltL")?musCol(zk(SL.zr)):NEU) });
    parts.push({ z:SR.zr+0.1, draw: ()=>this.sphere(SR, 5.8, this.hl.has("deltR")?musCol(zk(SR.zr)):NEU) });
    limb([J(SL,4.4), mid(SL,E1,0.45,5.2), J(E1,3.6)], "armL");
    limb([J(E1,3.5), mid(E1,W1,0.4,4.0), J(W1,2.5)], "foreL");
    limb([J(SR,4.4), mid(SR,E2,0.45,5.2), J(E2,3.6)], "armR");
    limb([J(E2,3.5), mid(E2,W2,0.4,4.0), J(W2,2.5)], "foreR");
    parts.push({z:W1.zr, draw:()=>this.sphere(W1,2.9,NEU)});
    parts.push({z:W2.zr, draw:()=>this.sphere(W2,2.9,NEU)});
    limb([J(HLp,6.2), mid(HLp,K1,0.42,6.6), J(K1,4.4)], this.hl.has("thighL")?"thighL":null);
    limb([J(K1,4.3), mid(K1,A1,0.35,5.0), J(A1,2.8)], "shinL");
    limb([J(HRp,6.2), mid(HRp,K2,0.42,6.6), J(K2,4.4)], this.hl.has("thighR")?"thighR":null);
    limb([J(K2,4.3), mid(K2,A2,0.35,5.0), J(A2,2.8)], "shinR");
    parts.push({ z:(HLp.zr+HRp.zr)/2+0.15, draw: ()=>{
      if(!this.hl.has("thighL")) this.limbShape([J(HLp,6.4), mid(HLp,K1,0.4,6.0)], shade(SHORTS, zk(HLp.zr)));
      if(!this.hl.has("thighR")) this.limbShape([J(HRp,6.4), mid(HRp,K2,0.4,6.0)], shade(SHORTS, zk(HRp.zr)));
    }});
    parts.push({z:A1.zr, draw:()=>this.sphere(A1,4.2,"#2b3444")});
    parts.push({z:A2.zr, draw:()=>this.sphere(A2,4.2,"#2b3444")});
    parts.push({z:H3.zr, draw:()=>{
      this.limbShape([J(N,3.2), J(H3,3.2)], shade(NEU, zk(N.zr)));
      this.sphere(H3, 8, NEU);
    }});

    jointAt(E1,1.6); jointAt(E2,1.6);
    jointAt(W1,1.3); jointAt(W2,1.3);
    jointAt(K1,1.7); jointAt(K2,1.7);
    jointAt(A1,1.4); jointAt(A2,1.4);

    /* ekipman */
    const day = this.dayColor;
    const t = this.ex.anim.eqType;
    if(t==="db"){
      parts.push({z:W1.zr+0.3, draw:()=>this.sphere(W1,6,day)});
      parts.push({z:W2.zr+0.3, draw:()=>this.sphere(W2,6,day)});
    } else if(t==="db1"){
      const Q = P3.Q ? pj("Q") : W1;
      parts.push({z:Q.zr+0.3, draw:()=>this.sphere(Q,7,day)});
    } else if(t==="kb"){
      const Q = P3.Q ? pj("Q") : pjp([(P3.W1[0]+P3.W2[0])/2,(P3.W1[1]+P3.W2[1])/2-11,(P3.W1[2]+P3.W2[2])/2]);
      const M = pjp([(P3.W1[0]+P3.W2[0])/2,(P3.W1[1]+P3.W2[1])/2,(P3.W1[2]+P3.W2[2])/2]);
      parts.push({z:Q.zr+0.3, draw:()=>{
        ctx.strokeStyle = shade(day, zk(Q.zr)); ctx.lineWidth = 3.2*Q.r; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(M.x,M.y); ctx.lineTo(Q.x,Q.y); ctx.stroke();
        this.sphere(Q,8,day);
      }});
    } else if(t==="ball"){
      const Q = P3.Q ? pj("Q") : W1;
      parts.push({z:Q.zr+0.3, draw:()=>this.sphere(Q,10,day)});
    } else if(t==="band"){
      const A = pjp(to3({A:this.ex.anim.anchor}).A);
      parts.push({z:Math.max(W1.zr,W2.zr), draw:()=>{
        ctx.strokeStyle = COL.band; ctx.lineWidth = 3; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(W1.x,W1.y); ctx.stroke();
        ctx.globalAlpha = .6;
        ctx.beginPath(); ctx.moveTo(A.x,A.y); ctx.lineTo(W2.x,W2.y); ctx.stroke();
        ctx.globalAlpha = 1;
        ctx.fillStyle = COL.band; ctx.fillRect(A.x-4,A.y-4,8,8);
      }});
    } else if(t==="bandwrists"){
      parts.push({z:Math.max(W1.zr,W2.zr), draw:()=>{
        ctx.strokeStyle = COL.band; ctx.lineWidth = 3; ctx.lineCap="round";
        ctx.beginPath(); ctx.moveTo(W1.x,W1.y); ctx.lineTo(W2.x,W2.y); ctx.stroke();
      }});
    }

    parts.sort((a,b)=>a.z-b.z).forEach(p=>p.draw());
  }
}

/* ---- kas grubu çıkarımı: hareketin çalıştırdığı bölgeler ---- */
function chartMuscles(ex){
  const s = new Set();
  for(const m of ex.muscles){
    if(/Göğüs|Serratus/.test(m)) s.add("pec");
    if(/omuz|Rotator/i.test(m)) s.add("delt");
    if(/Biceps/.test(m)) s.add("biceps");
    if(/Triceps/.test(m)) s.add("triceps");
    if(/Ön kol|Kavrama/.test(m)) s.add("forearm");
    if(/Core|karın/i.test(m)){ s.add("abs"); s.add("obliques") }
    if(/Oblik/.test(m)) s.add("obliques");
    if(/Bel/.test(m)) s.add("lowback");
    if(/Quadriceps|Bacak/.test(m)) s.add("quads");
    if(/Hamstring/.test(m)) s.add("hams");
    if(/Kalça/.test(m)) s.add("glutes");
    if(/Baldır/.test(m)) s.add("calves");
    if(/Lat|Sırt/.test(m)) s.add("lats");
    if(/Trapez|Üst sırt/.test(m)) s.add("traps");
  }
  return s;
}

/* ---- IndexedDB medya deposu: indirilen GIF'ler cihazda kalıcı, offline çalışır ---- */
const mediaDB = {
  _db: null,
  open(){
    return new Promise((res, rej)=>{
      if(this._db) return res(this._db);
      if(!window.indexedDB) return rej(new Error("IndexedDB yok"));
      const r = indexedDB.open("pht_media", 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore("gifs");
      r.onsuccess = ()=>{ this._db = r.result; res(this._db) };
      r.onerror = ()=> rej(r.error);
    });
  },
  async get(k){
    try{
      const db = await this.open();
      return await new Promise(res=>{
        const t = db.transaction("gifs").objectStore("gifs").get(k);
        t.onsuccess = ()=>res(t.result || null); t.onerror = ()=>res(null);
      });
    }catch(e){ return null }
  },
  async set(k, v){
    const db = await this.open();
    return new Promise((res, rej)=>{
      const t = db.transaction("gifs","readwrite").objectStore("gifs").put(v, k);
      t.onsuccess = ()=>res(); t.onerror = ()=>rej(t.error);
    });
  },
  async clear(){
    try{
      const db = await this.open();
      return await new Promise(res=>{
        const t = db.transaction("gifs","readwrite").objectStore("gifs").clear();
        t.onsuccess = ()=>res(); t.onerror = ()=>res();
      });
    }catch(e){}
  }
};

/* Zaman aşımı + otomatik yeniden denemeli fetch (mobil ağlarda kopmalara dayanıklı) */
async function fetchJSON(url, hdrs, tries, timeoutMs){
  tries = tries || 4; timeoutMs = timeoutMs || 20000;
  let lastErr = null;
  for(let i=0;i<tries;i++){
    try{
      const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      const to = ctl ? setTimeout(()=>ctl.abort(), timeoutMs) : 0;
      const r = await fetch(url, { headers: hdrs, signal: ctl ? ctl.signal : undefined });
      if(to) clearTimeout(to);
      if(!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }catch(e){
      lastErr = e;
      if(i < tries-1) await new Promise(rs=>setTimeout(rs, 700*(i+1)));
    }
  }
  throw lastErr || new Error("bağlantı hatası");
}

async function edbLoadCatalog(base, hdrs, log){
  const cached = await mediaDB.get("__catalog");
  if(cached && cached.items && cached.items.length >= 150){
    log(null, "Katalog önbellekten yüklendi (" + cached.items.length + " egzersiz)");
    return cached.items;
  }
  let items = [], cursor = null, page = 0, broke = null;
  while(page < 200){
    const u = base + "/api/v1/exercises?limit=100" +
      (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
    let r;
    try{ r = await fetchJSON(u, hdrs, 4, 20000) }
    catch(err){ broke = err; break }
    const d = (r && r.data) || [];
    for(const e of d) items.push({
      id: e.exerciseId, name: e.name || "", gif: e.gifUrl || "",
      eq: (e.equipments || []).join(" ")
    });
    log(null, "Katalog indiriliyor: " + items.length + " egzersiz…", true);
    if(!(r && r.meta && r.meta.hasNextPage && r.meta.nextCursor)) break;
    cursor = r.meta.nextCursor; page++;
    await new Promise(rs=>setTimeout(rs, 350));
  }
  if(broke){
    if(items.length >= 150){
      log(null, "Bağlantı yarıda koptu; " + items.length + " egzersizlik kısmi katalogla devam ediliyor.");
    } else {
      throw broke;
    }
  }
  if(items.length) await mediaDB.set("__catalog", { when: Date.now(), items });
  return items;
}

const edbNorm = s => (" " + String(s).toLowerCase()
  .replace(/[\u2019']/g,"").replace(/[-()./°]/g," ").replace(/\s+/g," ").trim() + " ");
function edbMatch(q, catalog){
  const qn = edbNorm(q);
  const qt = qn.trim().split(" ").filter(Boolean);
  let best = null, bs = 0;
  for(const it of catalog){
    if(!it.gif) continue;
    const name = edbNorm(it.name);
    if(name === qn) return { hit: it, exact: true };
    const eq = (it.eq || "").toLowerCase();
    let sc = 0;
    for(const t of qt){
      if(name.includes(" " + t + " ")) sc += 3;
      else if(name.includes(t)) sc += 1.5;
      if(eq.includes(t)) sc += 1;
    }
    sc -= name.trim().split(" ").length * 0.15;
    if(sc > bs){ bs = sc; best = it }
  }
  const need = Math.min(5, qt.length * 2);
  return bs >= need ? { hit: best, exact: false } : null;
}

async function edbSync(log){
  if(edbRunning) return; edbRunning = true;
  try{
    const key = (store.get("pht_edb_key") || "").trim();
    const bases = key ? ["https://" + EDB_HOST] : EDB_FREE_BASES;
    const hdrs = key ? { "X-RapidAPI-Key": key, "X-RapidAPI-Host": EDB_HOST } : {};

    let catalog = null, lastErr = null;
    for(const base of bases){
      log(null, "Sunucu deneniyor: " + base.replace("https://","") + "…");
      try{
        catalog = await edbLoadCatalog(base, hdrs, log);
        if(catalog && catalog.length){ break }
        catalog = null;
      }catch(err){ lastErr = err; log(null, "✗ Erişilemedi: " + base.replace("https://","")) }
    }
    if(!catalog || !catalog.length){
      log(null, "✗ Hiçbir sunucuya erişilemedi" + (lastErr ? " ("+(lastErr.message||lastErr)+")" : "") + ".");
      log(null, "İnternet bağlantını kontrol et ve birkaç dakika sonra tekrar dene. " +
        "Uygulama animasyonlar olmadan da çizim figürüyle tam çalışır.");
      return;
    }

    let ok = 0;
    for(const ex of EXERCISES){
      try{
        const qs = EDB_QUERY[ex.id] || [ex.name];
        let hit = null;
        for(const q of qs){
          const m = edbMatch(q, catalog);
          if(m && m.exact){ hit = m.hit; break }
          if(m && !hit) hit = m.hit;
        }
        if(!hit){ log(ex, "— katalogda karşılığı yok; çizim figürü kullanılacak"); continue }
        let rec = { url: hit.gif, name: hit.name };
        try{
          const resp = await fetch(hit.gif);
          if(resp.ok){
            const b = await resp.blob();
            if(b && b.size > 0) rec = { blob: b, name: hit.name };
          }
        }catch(e){ /* CORS → çevrimiçi bağlantı modu */ }
        await mediaDB.set(ex.id, rec);
        ok++;
        log(ex, "✓ " + hit.name + (rec.blob ? " · indirildi" : " · çevrimiçi bağlantı"));
        await new Promise(r=>setTimeout(r, 250));
      }catch(err){ log(ex, "✗ " + (err && err.message || "hata")) }
    }
    log(null, "Bitti: " + ok + "/" + EXERCISES.length + " hareket eşleşti.");
  } finally { edbRunning = false }
}

/* ---- animasyon adaptörü: gerçek GIF varsa onu, yoksa çizim figürünü oynatır ---- */
function createAnim(host, ex, opts){
  opts = opts || {};
  let a3d = null, video = null, cueRaf = 0, destroyed = false, objUrl = null;
  const api = {
    phases: buildPhases(ex),
    _drive: 0, _t: 0, _paused: false,
    drive(sp){ this._drive = sp || 1;
      if(a3d) a3d.drive(this._drive);
      if(!a3d && opts.cueEl) startMediaCue(this._drive);
    },
    setT(t){ this._t = t; if(a3d) a3d.setT(t) },
    set paused(v){ this._paused = v;
      if(a3d) a3d.paused = v;
      if(video){ if(v) video.pause(); else video.play().catch(()=>{}) } },
    get paused(){ return this._paused },
    set speed(v){ if(a3d) a3d.speed = v; if(video) try{ video.playbackRate = v }catch(e){} },
    set startTs(v){ if(a3d) a3d.startTs = v },
    destroy(){ destroyed = true; cancelAnimationFrame(cueRaf);
      if(a3d) a3d.destroy(); if(objUrl) URL.revokeObjectURL(objUrl); host.innerHTML = "" }
  };
  function startMediaCue(sp){
    cancelAnimationFrame(cueRaf);
    const t0 = performance.now();
    const tick = now=>{
      if(destroyed) return;
      if(!api._paused){
        const ms = ((now - t0) * sp) % api.phases.total;
        setCue(opts.cueEl, phaseAt(api.phases, ms).cue);
      }
      cueRaf = requestAnimationFrame(tick);
    };
    cueRaf = requestAnimationFrame(tick);
  }
  function useCanvas(){
    if(destroyed) return;
    host.innerHTML = "";
    const cv = document.createElement("canvas");
    cv.width = 760; cv.height = 400;
    host.appendChild(cv);
    a3d = new Anim3D(cv, ex, opts);
    a3d.setT(api._t); a3d.paused = api._paused;
    if(api._drive) a3d.drive(api._drive);
  }
  function showImg(srcUrl, onFail){
    if(destroyed) return;
    const img = document.createElement("img");
    img.alt = ex.name;
    img.onerror = onFail;
    img.onload = ()=>{ if(!destroyed){
      host.innerHTML = ""; host.appendChild(img);
      if(api._drive && opts.cueEl) startMediaCue(api._drive);
    }};
    img.src = srcUrl;
  }
  function tryLocalFiles(){
    if(destroyed) return;
    const vid = document.createElement("video");
    vid.muted = true; vid.loop = true; vid.autoplay = true;
    vid.setAttribute("playsinline","");
    vid.addEventListener("error", ()=> showImg("media/" + ex.id + ".gif", useCanvas));
    vid.addEventListener("canplay", ()=>{
      if(destroyed || a3d) return;
      video = vid;
      if(api._paused) vid.pause();
      if(api._drive && opts.cueEl) startMediaCue(api._drive);
    });
    vid.src = "media/" + ex.id + ".mp4";
    host.innerHTML = ""; host.appendChild(vid);
  }
  mediaDB.get(ex.id).then(rec=>{
    if(destroyed) return;
    if(rec && rec.blob){ objUrl = URL.createObjectURL(rec.blob); showImg(objUrl, tryLocalFiles) }
    else if(rec && rec.url){ showImg(rec.url, tryLocalFiles) }
    else tryLocalFiles();
  }).catch(()=>tryLocalFiles());
  return api;
}

/* komut overlay yardımcıları */
function setCue(el, cue){
  if(!el) return;
  el.textContent = cue || "";
  el.className = "ov-cue " + (
    /İn|İndir|Dön/.test(cue) ? "c-down" :
    /Bekle|Sık/.test(cue)    ? "c-hold" :
    /Kalk|Kaldır|Git/.test(cue) ? "c-up" : "");
}

/* ================= SES ================= */
function beep(freq, dur, vol){
  try{
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; g.gain.value = vol;
    o.start(); o.stop(ctx.currentTime + dur);
  }catch(e){}
}

/* ---- şablon editörü: hareket seç, set × tekrar gir ---- */
const EQ_LIST = ["Hepsi","Dumbbell","Kettlebell","Cable","Direnç bandı","Bench","Ağırlık topu","Vücut ağırlığı"];

function openEditor(t){
  editor = t ? {
    id: t.id, name: t.name, note: t.note || "", eq: "Hepsi",
    items: Object.fromEntries(t.items.map(it=>[it.ex, {sets:it.sets, reps:it.reps}]))
  } : { id:null, name:"", note:"", eq:"Hepsi", items:{} };
  renderProgram();
  window.scrollTo(0,0);
}

function renderEditor(v){
  const list = EXERCISES.filter(e=> editor.eq==="Hepsi" || e.eq.includes(editor.eq));
  const selCount = Object.keys(editor.items).length;
  v.innerHTML = `
    <div class="eyebrow">${editor.id ? "Şablonu düzenle" : "Yeni şablon"} — ${selCount} hareket seçili</div>
    <div class="prepbox">
      <label>Şablon adı</label>
      <input id="tpl-name" placeholder="örn. Koç Programı A" value="${esc(editor.name)}" autocomplete="off">
      <label style="margin-top:10px">Not (isteğe bağlı)</label>
      <input id="tpl-note" placeholder="örn. Pzt-Çar-Cum · 4 hafta" value="${esc(editor.note)}" autocomplete="off">
    </div>
    <div class="eyebrow">Hareket seç — ekipmana göre filtrele, sete/tekrara dokun</div>
    <div class="chips">${EQ_LIST.map(g=>`<button class="chip ${g===editor.eq?"on":""}" data-g="${g}">${g}</button>`).join("")}</div>
    ${list.map(e=>{
      const it = editor.items[e.id];
      return `<div class="pickrow ${it?"sel":""}" data-ex="${e.id}">
        <div class="n"><b>${e.name}</b><small>${e.muscles.join(" · ")} · ${e.eq.join(" + ")}</small></div>
        ${it
          ? `<input class="mini" data-f="sets" inputmode="numeric" value="${it.sets}"><span class="x">set ×</span>
             <input class="mini" data-f="reps" inputmode="numeric" value="${it.reps}"><span class="x">${e.timed?"sn":"tekrar"}</span>`
          : `<span class="x" style="font-size:18px">＋</span>`}
      </div>`;
    }).join("")}
    <div class="pctl" style="margin-top:12px">
      <button class="btn primary" id="tpl-save">✔ Kaydet</button>
      <button class="btn ghost small" id="tpl-cancel">İptal</button>
    </div>
    <div class="hint">Kaydettikten sonra şablonu ⇪ Dışa aktar ile dosya olarak paylaşabilirsin.</div>`;
  const nameInp = document.getElementById("tpl-name");
  const noteInp = document.getElementById("tpl-note");
  nameInp.addEventListener("input", ()=> editor.name = nameInp.value);
  noteInp.addEventListener("input", ()=> editor.note = noteInp.value);
  v.querySelectorAll(".chip").forEach(c=>c.addEventListener("click", ()=>{
    editor.eq = c.dataset.g; renderProgram();
  }));
  v.querySelectorAll(".pickrow").forEach(r=>{
    r.addEventListener("click", e=>{
      if(e.target.classList.contains("mini")) return;
      const id = r.dataset.ex, ex = exById(id);
      if(editor.items[id]) delete editor.items[id];
      else editor.items[id] = { sets:3, reps: ex.timed ? ex.timed : ex.reps };
      renderProgram();
    });
    r.querySelectorAll(".mini").forEach(inp=>{
      inp.addEventListener("click", e=>e.stopPropagation());
      inp.addEventListener("change", ()=>{
        const id = r.dataset.ex, f = inp.dataset.f;
        if(!editor.items[id]) return;
        const val = f==="sets" ? clampN(inp.value,1,10,3) : clampN(inp.value,1,300,12);
        editor.items[id][f] = val;
        inp.value = val;
      });
    });
  });
  document.getElementById("tpl-cancel").addEventListener("click", ()=>{ editor = null; renderProgram() });
  document.getElementById("tpl-save").addEventListener("click", ()=>{
    const name = (editor.name||"").trim();
    if(!name){ alert("Şablona bir ad ver."); nameInp.focus(); return }
    const items = Object.entries(editor.items).map(([ex,it])=>({
      ex, sets:clampN(it.sets,1,10,3), reps:clampN(it.reps,1,300,12) }));
    if(!items.length){ alert("En az bir hareket seç."); return }
    const listC = customTemplates();
    if(editor.id){
      const i = listC.findIndex(x=>x.id===editor.id);
      if(i>=0){ listC[i] = {...listC[i], name, note:editor.note.trim(), items}; saveCustomTemplates(listC) }
    } else {
      listC.push({ id:"c"+Date.now(), name, note:editor.note.trim(),
        colorHex:pickColor(listC.length), items });
      saveCustomTemplates(listC);
    }
    editor = null;
    renderProgram();
  });
}

/* ---- HAREKETLER: kas haritası + ekipman filtresi ---- */
let libEq = "Hepsi", libMuscle = null, libQuery = "";
const trLow = s => String(s).toLocaleLowerCase("tr");
function libFiltered(){
  const eqOk  = ex => libEq==="Hepsi" || ex.eq.includes(libEq);
  const musOk = ex => !libMuscle || chartMuscles(ex).has(libMuscle);
  const qn = trLow(libQuery.trim());
  const qOk = ex => !qn || trLow(ex.name+" "+(ex.alias||[]).join(" ")+" "+ex.muscles.join(" ")+" "+ex.eq.join(" ")).includes(qn);
  return EXERCISES.filter(e=>eqOk(e) && musOk(e) && qOk(e));
}
function libCountText(n){
  return libQuery.trim()
    ? '"'+libQuery.trim()+'" → '+n+" hareket"
    : (libMuscle ? MUSCLE_TR[libMuscle] + (libEq!=="Hepsi" ? " · " + libEq : "") + " → " + n + " hareket"
                 : "Tüm hareketler → " + n);
}
function listHTML(list){
  return list.map(e=>exRowHTML(e, colorOf(e))).join("") +
    (list.length===0 ? `<div class="empty">Bu filtrelerle kayıtlı hareket yok.<br>Aramayı veya ekipman filtresini gevşetmeyi dene.</div>` : "");
}
function renderLibrary(){
  const v = document.getElementById("view-library");
  const list = libFiltered();
  v.innerHTML = `
    <div class="eyebrow">Hareket ara</div>
    <div class="searchbox"><input id="lib-q" type="search" placeholder="İsimle ara… (örn. squat, şınav, RDL, lat)" value="${esc(libQuery)}" autocomplete="off"></div>
    <div class="eyebrow">1 · Ekipman seç</div>
    <div class="chips">${EQ_LIST.map(g=>`<button class="chip ${g===libEq?"on":""}" data-g="${g}">${g}</button>`).join("")}</div>
    <div class="eyebrow">2 · Çalıştırmak istediğin kas grubuna dokun</div>
    ${bodyMaps(libMuscle)}
    <div class="mselbar">
      <b style="flex:1" id="lib-count">${libCountText(list.length)}</b>
      ${(libMuscle||libQuery)?`<button class="chip" id="m-clear">✕ Temizle</button>`:""}
    </div>
    <div id="lib-list">${listHTML(list)}</div>
`;
  v.querySelectorAll(".chip[data-g]").forEach(c=>c.addEventListener("click",()=>{ libEq=c.dataset.g; renderLibrary() }));
  v.querySelectorAll("[data-m]").forEach(el=>el.addEventListener("click",()=>{
    const m = el.dataset.m;
    libMuscle = (libMuscle===m) ? null : m;
    renderLibrary();
  }));
  const mc = document.getElementById("m-clear");
  if(mc) mc.addEventListener("click", ()=>{ libMuscle=null; libQuery=""; renderLibrary() });
  const qInp = document.getElementById("lib-q");
  qInp.addEventListener("input", ()=>{
    libQuery = qInp.value;
    const fresh = libFiltered();
    const listEl = document.getElementById("lib-list");
    const cntEl = document.getElementById("lib-count");
    if(listEl){ listEl.innerHTML = listHTML(fresh); bindExRows(listEl) }
    if(cntEl){ cntEl.textContent = libCountText(fresh.length) }
  });
  bindExRows(document.getElementById("lib-list"));
}

  const logEl = document.getElementById("edb-log");
  const logFn = (ex, msg, replaceLast)=>{
    let line = replaceLast ? logEl.lastElementChild : null;
    if(!line){ line = document.createElement("div"); logEl.appendChild(line) }
    line.className = /✓/.test(msg) ? "ok" : /✗/.test(msg) ? "no" : "";
    line.textContent = (ex ? ex.name + ": " : "") + msg;
    logEl.scrollTop = logEl.scrollHeight;
  };
  document.getElementById("edb-sync").addEventListener("click", ()=>{
    store.set("pht_edb_key", keyInp.value.trim());
    logEl.innerHTML = "";
    edbSync(logFn);
  });
  document.getElementById("edb-clear").addEventListener("click", async ()=>{
    if(confirm("İndirilen tüm ExerciseDB animasyonları silinsin mi?")){
      await mediaDB.clear();
      logFn(null, "Önbellek temizlendi. Hareketler çizim figürüne döner.");
    }
  });
}

/* ---- hareket detay sheet ---- */
let sheetAnim = null;
function openSheet(exId){
  closeSheet();
  const ex = exById(exId);
  if(!ex) return;
  const dayColor = colorOf(ex);
  const tSum = (ex.tempo[0]+ex.tempo[1]+ex.tempo[2]+ex.tempo[3])/1000;
  const root = document.getElementById("sheet-root");
  root.innerHTML = `
  <div class="sheet-bg" id="sheet-bg">
    <div class="sheet">
      <div class="grab"></div>
      <h2>${ex.name}</h2>
      <div class="meta">${ex.sets} · tekrar ~${tSum.toFixed(1)} sn · dinlenme ${ex.rest} sn · ${ex.eq.join(" + ")}</div>
      ${ex.alias && ex.alias.length ? `<div class="meta">Diğer adları: ${ex.alias.map(esc).join(" · ")}</div>` : ""}
      <div class="meta hidden" id="sheet-edb"></div>
      <div class="mchips">${ex.muscles.map(m=>`<span class="mchip" style="border-left:3px solid ${dayColor}">${m}</span>`).join("")}</div>
      ${muscleCards(ex)}
      <div class="animbox">
        <div class="animhost" id="sheetcv"></div>
        <div class="ov-view l">YAN</div><div class="ov-view r">ÖN</div>
        <div class="ov-cue" id="sheetcue"></div>
      </div>
      <div class="animctl">
        <button data-sp="0.5">0.5×</button>
        <button data-sp="1" class="on">Gerçek hız</button>
        <button data-sp="pause">⏸</button>
      </div>
      <div class="tips">
        <h3>Püf noktaları</h3>
        <ul>${ex.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
        <div class="mistake"><b>Sık yapılan hata</b>${ex.mistake}</div>
      </div>
    </div>
  </div>`;
  sheetAnim = createAnim(document.getElementById("sheetcv"), ex, {cueEl: document.getElementById("sheetcue")});
  sheetAnim.drive();
  mediaDB.get(ex.id).then(rec=>{
    const el = document.getElementById("sheet-edb");
    if(el && rec && rec.name){
      el.classList.remove("hidden");
      el.innerHTML = 'ExerciseDB adı: <b style="color:var(--neonB)">' + esc(rec.name) + "</b>";
    }
  }).catch(()=>{});
  root.querySelector("#sheet-bg").addEventListener("click", e=>{ if(e.target.id==="sheet-bg") closeSheet() });
  root.querySelectorAll(".animctl button").forEach(b=>{
    b.addEventListener("click", ()=>{
      const sp = b.dataset.sp;
      root.querySelectorAll(".animctl button").forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      if(sp==="pause"){ sheetAnim.paused = true }
      else { sheetAnim.paused = false; sheetAnim.speed = parseFloat(sp); sheetAnim.startTs = performance.now() }
    });
  });
}
function closeSheet(){
  if(sheetAnim){ sheetAnim.destroy(); sheetAnim = null }
  document.getElementById("sheet-root").innerHTML = "";
}

/* ================= ANTRENMAN OYNATICI =================
   Şablon tabanlı: her hareketin set ve tekrar sayısı şablondan gelir.
   Akış: idle → prep → work → rest → work … → done */
const player = {
  state:"idle", tplId:null, exIdx:0, setIdx:0, rep:0,
  phaseMs:0, lastTs:0, paused:false, anim:null, raf:0,
  restLeft:0, setsDone:0, startedAt:0, timedLeft:0,
  weightVal:"", lastRestSec:-1
};
const curTpl = ()=> tplById(player.tplId);
const curItem = ()=> curTpl().items[player.exIdx];
const currentEx = ()=> exById(curItem().ex);

/* ---- ağırlık kayıtları ---- */
function getWeight(exId){
  const w = store.get("pht_weights") || {};
  return w[exId] ? w[exId].last : null;
}
function saveWeight(exId, val){
  if(!val) return;
  const w = store.get("pht_weights") || {};
  const cur = w[exId] || { hist:[] };
  if(cur.last && cur.last !== val) cur.prev = cur.last;
  cur.last = val;
  cur.hist = (cur.hist||[]).concat([{d:new Date().toISOString().slice(0,10), v:val}]).slice(-10);
  w[exId] = cur;
  store.set("pht_weights", w);
}

function renderWorkout(){
  const v = document.getElementById("view-workout");
  if(player.anim){ player.anim.destroy(); player.anim = null }

  if(player.state==="idle"){
    const tpls = allTemplates();
    v.innerHTML = `
      <div class="eyebrow">Şablon seç ve başlat</div>
      ${tpls.map(t=>`
        <div class="daycard"><div class="dayhead">
          <div class="plate" style="border-color:${t.colorHex}"></div>
          <div class="t"><b>${esc(t.name)}</b><small>${t.items.length} hareket · ${t.builtin?"önerilen":"özel"} · rehberli tempo</small></div>
          <button class="startbig" data-t="${t.id}" style="width:auto;padding:10px 18px;margin:0;background:${t.colorHex};color:#fff">▶ Start</button>
        </div></div>`).join("")}
      <div class="hint">Start: her hareketten önce ekipmanını hazırlar, ağırlığını girersin.<br>Ready'ye basınca animasyon gerçek hızda önder olur.</div>`;
    v.querySelectorAll(".startbig").forEach(b=>b.addEventListener("click", e=>{
      e.stopPropagation();
      startProgram(b.dataset.t);
    }));
    return;
  }

  const tpl = curTpl();
  if(!tpl){ player.state="idle"; renderWorkout(); return }
  const item = curItem();
  const ex = currentEx();

  if(player.state==="prep"){
    const prevW = getWeight(ex.id);
    v.innerHTML = `
      <div class="player-head">
        <b>${ex.name}</b>
        <span class="setinfo">Hazırlık · ${player.exIdx+1}/${tpl.items.length}</span>
      </div>
      <div class="animbox">
        <div class="animhost" id="playercv"></div>
        <div class="ov-view l">YAN</div><div class="ov-view r">ÖN</div>
        <div class="ov-cue" id="prep-cue"></div>
      </div>
      ${muscleCards(ex)}
      <div class="prepbox">
        <label>Ağırlık / ekipman (${ex.eq.join(" + ")})</label>
        <input id="p-weight" placeholder="örn. 12 kg · kırmızı bant" value="${esc(prevW||"")}" autocomplete="off">
        <div class="prevref">${prevW ? `Geçen sefer: <b>${esc(prevW)}</b>` : "İlk kayıt — bugünkü ağırlığını gir"}</div>
      </div>
      <div class="pctl">
        <button class="btn ghost small" id="p-how">Nasıl?</button>
        <button class="btn primary" id="p-ready">✔ Ready — Başla</button>
        <button class="btn danger small" id="p-end">■ End</button>
      </div>
      <div class="hint">${item.sets} set × ${item.reps}${ex.timed?" sn":" tekrar"}${ex.sideNote ? " · " + ex.sideNote : ""} · Ekipmanını hazırla, hazır olunca Ready.</div>`;
    player.anim = createAnim(document.getElementById("playercv"), ex, {cueEl: document.getElementById("prep-cue")});
    player.anim.drive(0.7);
    const inp = document.getElementById("p-weight");
    const goReady = ()=>{
      player.weightVal = inp.value.trim();
      saveWeight(ex.id, player.weightVal);
      player.rep = 0; player.phaseMs = 0; player.lastRestSec = -1;
      player.timedLeft = ex.timed ? item.reps*1000 : 0;
      player.state = "work"; player.lastTs = performance.now();
      beep(660,.12,.1);
      renderWorkout();
    };
    document.getElementById("p-ready").addEventListener("click", goReady);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") goReady() });
    document.getElementById("p-how").addEventListener("click", ()=>openSheet(ex.id));
    document.getElementById("p-end").addEventListener("click", ()=>{
      if(confirm("Antrenman bitirilsin ve kaydedilsin mi?")) endProgram();
    });
    return;
  }

  /* work / rest ortak ekranı */
  v.innerHTML = `
    <div class="player-head">
      <b id="p-exname">${ex.name}</b>
      <span class="setinfo" id="p-setinfo"></span>
    </div>
    <div class="animbox">
      <div class="animhost" id="playercv"></div>
      <div class="ov-view l">YAN</div><div class="ov-view r">ÖN</div>
      <div class="ov-cue" id="p-cue"></div>
      <div class="ov-rep" id="p-rep">–</div>
    </div>
    <div class="pbar"><div id="p-bar"></div></div>
    <div class="pctl">
      <button class="btn ghost small" id="p-how">Nasıl?</button>
      <button class="btn primary" id="p-pause">⏸ Pause</button>
      <button class="btn ghost small" id="p-skip">Geç ›</button>
      <button class="btn danger small" id="p-end">■ End</button>
    </div>
    <div class="hint" id="p-note"></div>`;
  player.anim = createAnim(document.getElementById("playercv"), ex);
  document.getElementById("p-how").addEventListener("click", ()=>{ setPaused(true); openSheet(ex.id) });
  document.getElementById("p-pause").addEventListener("click", ()=>setPaused(!player.paused));
  document.getElementById("p-skip").addEventListener("click", skipStep);
  document.getElementById("p-end").addEventListener("click", ()=>{
    if(confirm("Antrenman bitirilsin ve kaydedilsin mi?")) endProgram();
  });
}

function startProgram(tplId){
  Object.assign(player, { state:"prep", tplId, exIdx:0, setIdx:0, rep:0,
    phaseMs:0, lastTs:performance.now(), paused:false, restLeft:0,
    setsDone:0, startedAt:Date.now(), timedLeft:0, weightVal:"", lastRestSec:-1 });
  renderWorkout();
  cancelAnimationFrame(player.raf);
  player.raf = requestAnimationFrame(playerLoop);
}
function setPaused(p){
  player.paused = p;
  const b = document.getElementById("p-pause");
  if(b) b.textContent = p ? "▶ Devam" : "⏸ Pause";
  if(!p) player.lastTs = performance.now();
}

function advanceSet(){
  player.setsDone++;
  beep(880,.18,.12); if(navigator.vibrate) navigator.vibrate(150);
  const tpl = curTpl(), item = curItem(), ex = currentEx();
  const lastSet = player.setIdx >= item.sets-1;
  const lastEx = player.exIdx >= tpl.items.length-1;
  if(lastSet && lastEx){ finishProgram(); return }
  if(lastSet){
    beep(880,.15,.12); setTimeout(()=>beep(1100,.2,.12), 180);
    player.exIdx++; player.setIdx = 0;
    player.state = "prep";
    renderWorkout();
  } else {
    player.state = "rest";
    player.restLeft = ex.rest * 1000;
    player.lastRestSec = -1;
  }
}
function afterRest(){
  const item = curItem(), ex = currentEx();
  player.setIdx++;
  player.state = "work"; player.rep = 0; player.phaseMs = 0;
  player.timedLeft = ex.timed ? item.reps*1000 : 0;
  beep(660,.12,.1);
}
function skipStep(){
  if(player.state==="work"){ advanceSet(); player.lastTs = performance.now() }
  else if(player.state==="rest"){ player.restLeft = 0 }
}
function finishProgram(){
  saveSession(true);
  cancelAnimationFrame(player.raf);
  const done = player.setsDone;
  if(player.anim){ player.anim.destroy(); player.anim = null }
  player.state = "idle";
  const v = document.getElementById("view-workout");
  v.innerHTML = `<div class="empty" style="padding:60px 20px">
    <div style="font-size:44px">💪</div>
    <b style="color:var(--text);font-size:18px">Antrenman tamamlandı!</b><br>
    ${done} set bitirdin. Kayıt Geçmiş'e eklendi.</div>
    <button class="btn primary" style="width:100%" id="p-done">Tamam</button>`;
  document.getElementById("p-done").addEventListener("click", ()=>switchView("history"));
}
function endProgram(){
  saveSession(false);
  cancelAnimationFrame(player.raf);
  if(player.anim){ player.anim.destroy(); player.anim = null }
  player.state = "idle";
  renderWorkout();
}
function saveSession(full){
  const tpl = curTpl();
  if(!tpl) return;
  const sessions = store.get("pht_sessions") || store.get("befit_sessions") || [];
  const totalSets = tpl.items.reduce((s,it)=>s+it.sets, 0);
  sessions.unshift({
    tplName: tpl.name, colorHex: tpl.colorHex,
    date: new Date().toISOString(),
    mins: Math.max(1, Math.round((Date.now()-player.startedAt)/60000)),
    sets: player.setsDone, totalSets, full
  });
  store.set("pht_sessions", sessions);
}

function playerLoop(now){
  if(player.state==="idle") return;
  const dt = player.paused ? 0 : Math.min(100, now - player.lastTs);
  player.lastTs = now;

  if(player.state==="prep"){
    player.raf = requestAnimationFrame(playerLoop);
    return;
  }
  const item = curItem();
  const ex = currentEx();
  const setInfo = document.getElementById("p-setinfo");
  const repEl = document.getElementById("p-rep");
  const cueEl = document.getElementById("p-cue");
  const barEl = document.getElementById("p-bar");
  const noteEl = document.getElementById("p-note");
  const wTag = player.weightVal ? " · " + player.weightVal : "";

  if(player.state==="work"){
    if(setInfo) setInfo.textContent = `Set ${player.setIdx+1}/${item.sets}${wTag}`;
    if(noteEl) noteEl.textContent = ex.sideNote || "";
    if(ex.timed){
      player.timedLeft -= dt;
      const phases = player.anim.phases;
      player.phaseMs = (player.phaseMs + dt) % phases.total;
      player.anim.setT(phaseAt(phases, player.phaseMs).t);
      const s = Math.max(0, Math.ceil(player.timedLeft/1000));
      if(repEl) repEl.textContent = `0:${String(s).padStart(2,"0")}`;
      setCue(cueEl, "Pozisyonu koru");
      if(barEl) barEl.style.width = (100*(1 - player.timedLeft/(item.reps*1000))) + "%";
      if(player.timedLeft <= 0){ advanceSet() }
    } else {
      const phases = player.anim.phases;
      player.phaseMs += dt;
      if(player.phaseMs >= phases.total){
        player.phaseMs -= phases.total;
        player.rep++;
        beep(520,.05,.06);
        if(player.rep >= item.reps){ advanceSet(); player.phaseMs = 0 }
      }
      if(player.state==="work"){
        const ph = phaseAt(phases, player.phaseMs);
        player.anim.setT(ph.t);
        if(repEl) repEl.textContent = `${Math.min(player.rep+1, item.reps)} / ${item.reps}`;
        setCue(cueEl, ph.cue);
        if(barEl) barEl.style.width = (100*player.rep/item.reps) + "%";
      }
    }
  }
  if(player.state==="rest"){
    player.restLeft -= dt;
    const s = Math.max(0, Math.ceil(player.restLeft/1000));
    if(s !== player.lastRestSec){
      player.lastRestSec = s;
      if(s <= 5 && s > 0){ beep(740,.08,.1); if(navigator.vibrate) navigator.vibrate(60) }
    }
    if(repEl) repEl.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
    if(cueEl){
      if(s <= 5){ cueEl.textContent = "HAZIRLAN!"; cueEl.className = "ov-cue c-ready" }
      else { cueEl.textContent = "Dinlen"; cueEl.className = "ov-cue" }
    }
    if(setInfo) setInfo.textContent = `Set ${player.setIdx+1}/${item.sets} bitti${wTag}`;
    if(noteEl) noteEl.textContent = `Sıradaki: ${ex.name} — Set ${player.setIdx+2}/${item.sets}`;
    if(barEl) barEl.style.width = (100*(1 - player.restLeft/(ex.rest*1000))) + "%";
    if(player.anim) player.anim.setT(0);
    if(player.restLeft <= 0){
      beep(660,.15,.12); if(navigator.vibrate) navigator.vibrate([120,80,120]);
      afterRest();
    }
  }
  player.raf = requestAnimationFrame(playerLoop);
}

/* ---- geçmiş ---- */
function renderHistory(){
  const v = document.getElementById("view-history");
  const sessions = store.get("pht_sessions") || store.get("befit_sessions") || [];
  if(sessions.length===0){
    v.innerHTML = `<div class="eyebrow">Geçmiş</div>
      <div class="empty">Henüz kayıtlı seans yok.<br>Antrenman sekmesinden Start'a bas.</div>`;
    return;
  }
  const fmt = iso => new Date(iso).toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"short"});
  const oldDays = {1:"Bacak & Core",2:"Üst Vücut",3:"Full Body"};
  const oldCols = {1:"#d9534a",2:"#4a7fd4",3:"#57a06a"};
  v.innerHTML = `
    <div class="eyebrow">Geçmiş — ${sessions.length} seans</div>
    ${sessions.map(s=>{
      const name = s.tplName || oldDays[s.dayId] || "Antrenman";
      const col = s.colorHex || oldCols[s.dayId] || "#efa33a";
      return `<div class="hcard">
        <div class="hd"><b style="color:${col}">${esc(name)}${s.full?"":" (yarım)"}</b><small>${fmt(s.date)}</small></div>
        <div class="st">${s.sets}/${s.totalSets} set · ${s.mins} dk</div>
      </div>`;
    }).join("")}`;
}

/* ================= NAVİGASYON ================= */
const VIEWS = ["program","library","workout","history","settings"];
function switchView(name){
  closeSheet();
  if(name!=="workout" && player.state!=="idle"){
    setPaused(true);
  }
  VIEWS.forEach(vn=>{
    document.getElementById("view-"+vn).classList.toggle("hidden", vn!==name);
    document.getElementById("nav-"+vn).classList.toggle("on", vn===name);
  });
  if(name==="program") renderProgram();
  if(name==="library") renderLibrary();
  if(name==="workout" && player.state==="idle") renderWorkout();
  if(name==="history") renderHistory();
  if(name==="settings") renderSettings();
}
VIEWS.forEach(vn=>document.getElementById("nav-"+vn).addEventListener("click",()=>switchView(vn)));
renderProgram();
renderWorkout();
</script>

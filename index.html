<style>
:root{
  --bg:#0a101e; --surface:#141d2e; --surface2:#1d2940; --line:#33405c;
  --text:#f2eee4; --dim:#c7d2e4;
  --neonO:#ffb033; --neonG:#3dffa2; --neonB:#5fd0ff;
  --red:#d9534a; --blue:#4a7fd4; --green:#57a06a; --amber:#efa33a;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
html,body{height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Comic Sans MS","Comic Sans","Chalkboard SE","Comic Neue",cursive;
  font-size:16px; line-height:1.5;
}
header{
  padding:14px 16px 10px; display:flex; align-items:baseline; gap:10px;
  border-bottom:1px solid var(--line);
  padding-top:calc(14px + env(safe-area-inset-top));
}
header h1{display:flex; align-items:center; gap:9px; font-size:20px; font-weight:800; letter-spacing:.05em;
  color:#40f0ff}
header h1 span{color:#9df7ff}
header h1 .ini{font-size:1.32em; font-weight:900; line-height:1}
#errbar{
  background:#7a1f18; color:#ffd9d4; font-size:13px; padding:8px 14px;
  border-bottom:1px solid #a33; word-break:break-all;
}
.animbox video, .animbox img{width:100%; display:block; background:#fff}
.edbpanel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:14px}
.edbpanel input{
  width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text);
  border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:8px;
}
.edbrow{display:flex; gap:8px}
.edbrow button{
  flex:1; padding:11px; border-radius:10px; border:none; font-weight:800; font-size:13.5px; cursor:pointer;
}
.edbrow .go{background:var(--amber); color:#231a08}
.edbrow .cl{background:none; color:var(--dim); border:1px solid var(--line)}
#edb-log{margin-top:10px; font-size:13.5px; line-height:1.7; color:#cdd8ea; max-height:180px; overflow-y:auto}
#edb-log .ok{color:#7fe08a} #edb-log .no{color:#ff8d80}
.animbox .animhost{min-height:120px}
main{
  padding:14px 14px calc(92px + env(safe-area-inset-bottom));
  max-width:640px; margin:0 auto;
}
.hidden{display:none !important}
.eyebrow{
  font-size:13px; font-weight:800; letter-spacing:.14em; text-transform:uppercase;
  color:var(--neonG);
  margin:18px 2px 8px;
}
.daycard{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  margin-bottom:12px; overflow:hidden;
}
.daycard .dayhead{display:flex; align-items:center; gap:10px; padding:14px; cursor:pointer}
.plate{width:26px; height:26px; border-radius:50%; flex:none; border:5px solid; background:var(--bg)}
.dayhead .t{flex:1; min-width:0}
.dayhead .t b{font-size:16.5px; display:block}
.dayhead .t small{color:#cdd8ea; font-size:13px}
.dayhead .chev{color:var(--dim); transition:transform .2s; font-size:18px}
.daycard.open .chev{transform:rotate(90deg)}
.daycard .exlist{display:none; border-top:1px solid var(--line)}
.daycard.open .exlist{display:block}
.exrow{
  display:flex; align-items:center; gap:10px; padding:11px 14px;
  border-bottom:1px solid var(--line); cursor:pointer;
}
.exrow:last-child{border-bottom:none}
.exrow:active{background:var(--surface2)}
.exrow .bar{width:4px; align-self:stretch; border-radius:2px; flex:none}
.exrow .n{flex:1; min-width:0}
.exrow .n b{display:block; font-size:15.5px}
.exrow .n small{color:#cdd8ea; font-size:13px}
.exrow .sr{font-size:13.5px; color:var(--neonB); font-variant-numeric:tabular-nums; flex:none}
.chips{display:flex; gap:8px; flex-wrap:wrap; margin:10px 0}
.chip{
  border:1px solid var(--line); background:var(--surface); color:var(--dim);
  border-radius:999px; padding:7px 14px; font-size:14px; font-weight:700; cursor:pointer;
}
.chip.on{background:var(--neonB); color:#03222f; border-color:var(--neonB); box-shadow:0 0 10px rgba(95,208,255,.55)}

/* ---- şablon kartı düğmeleri / editör ---- */
.tplbtns{display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line)}
.tplbtns button{
  flex:1; background:none; border:1px solid var(--line); color:var(--dim);
  border-radius:8px; padding:8px 4px; font-size:12px; font-weight:700; cursor:pointer;
}
.tplbtns button.warn{color:var(--red); border-color:rgba(217,83,74,.5)}
.pickrow{
  display:flex; align-items:center; gap:8px; padding:10px 12px;
  border:1px solid var(--line); border-radius:10px; margin-bottom:8px;
  background:var(--surface); cursor:pointer;
}
.pickrow.sel{border-color:var(--amber)}
.pickrow .n{flex:1; min-width:0}
.pickrow .n b{font-size:14.5px; display:block}
.pickrow .n small{color:#cdd8ea; font-size:12.5px}
.pickrow .mini{
  width:46px; background:var(--bg); border:1px solid var(--line); color:var(--text);
  border-radius:8px; padding:7px 4px; font-size:14px; font-weight:700; text-align:center; flex:none;
}
.pickrow .x{color:var(--dim); font-size:11.5px; font-weight:700; flex:none}
.setbtns{display:flex; gap:10px; margin-bottom:10px}
.setbtns .btn{flex:1 1 0; padding:16px 8px; font-size:14.5px; line-height:1.3; min-height:64px}
.searchbox input{
  width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
  border-radius:12px; padding:12px 14px; font-size:16px; font-weight:600;
}
.searchbox input:focus{outline:none; border-color:var(--neonB); box-shadow:0 0 10px rgba(95,208,255,.35)}
.searchbox input::placeholder{color:#93a2ba}
.mselbar{display:flex; align-items:center; gap:8px; margin:4px 2px 10px; font-size:15px}
.mselbar b{color:var(--neonB)}
.mapcards .mcard{max-width:240px}
.mapcards [data-m]{cursor:pointer}

/* ---- 3D animasyon kutusu ---- */
.animbox{position:relative; 
  background:linear-gradient(180deg, #232e3e 0%, #1a2230 58%, #131922 100%);
  border:1px solid var(--line); border-radius:var(--radius);
  padding:0; margin-bottom:12px; position:relative; overflow:hidden;
}
.animbox canvas{width:100%; height:auto; display:block; border-radius:var(--radius)}
.ov-view{
  position:absolute; top:10px; color:var(--neonB); font-size:13px; font-weight:800;
  letter-spacing:.22em; background:rgba(10,14,20,.55); padding:4px 12px; border-radius:999px;
  pointer-events:none;
}
.ov-view.l{left:12px} .ov-view.r{right:12px}
.ov-cue{
  position:absolute; top:38px; left:0; right:0; text-align:center; pointer-events:none;
  font-size:52px; font-weight:900; letter-spacing:.08em; color:#fff;
  line-height:1;
}
.ov-cue.c-down{color:#6db2ff} .ov-cue.c-hold{color:#ffc14d}
.ov-cue.c-up{color:#7fe08a} .ov-cue.c-ready{color:#ff5f4d; animation:pulseCue .8s infinite}
@keyframes pulseCue{50%{transform:scale(1.12)}}
.mcards{display:flex; gap:12px; justify-content:center; margin-bottom:12px}
.mcard{
  background:#f2f4f7; border:1px solid #d5dae2; border-radius:14px;
  padding:8px 10px 6px; text-align:center; flex:1; max-width:190px;
}
.mcard svg{width:100%; max-width:160px; height:auto; display:block; margin:0 auto}
.mcard .mlbl{font-size:11px; font-weight:800; letter-spacing:.22em; color:#5b6572; margin-bottom:4px}
.mapcards .mcard svg{max-width:220px}
.ov-rep{
  position:absolute; bottom:12px; left:0; right:0; text-align:center; pointer-events:none;
  font-size:44px; font-weight:900; font-variant-numeric:tabular-nums; color:#fff;
}
.animctl{display:flex; justify-content:center; gap:8px; padding:6px 0 4px}
.animctl button{
  background:var(--bg); color:var(--dim); border:1px solid var(--line);
  border-radius:8px; padding:5px 14px; font-size:12px; font-weight:700; cursor:pointer;
}
.animctl button.on{color:var(--amber); border-color:var(--amber)}

/* ---- detay sheet ---- */
.sheet-bg{position:fixed; inset:0; background:rgba(6,9,14,.72); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{
  background:var(--surface); width:100%; max-width:640px; border-radius:20px 20px 0 0;
  max-height:92vh; max-height:92dvh; overflow-y:auto;
  padding:10px 18px calc(24px + env(safe-area-inset-bottom));
  border:1px solid var(--line); border-bottom:none;
}
.sheet-xwrap{position:sticky; top:2px; z-index:6; display:flex; justify-content:flex-end; height:0}
.sheet-x{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--line);
  background:var(--surface2); color:var(--text); font-size:17px; font-weight:800; cursor:pointer;
  box-shadow:0 2px 10px rgba(0,0,0,.45);
}
.animbox.big img{max-height:56vh; object-fit:contain}
.gif-missing{
  padding:46px 18px; text-align:center; color:#3b4656; background:#fff;
  font-size:15px; font-weight:600; line-height:1.6;
}
.pline{
  text-align:center; font-size:32px; font-weight:900; margin:4px 0 6px;
  color:#ff2d2d; letter-spacing:.02em; line-height:1.12; min-height:40px;
  font-variant-numeric:tabular-nums;
}
.pline.warn{color:#ff5555}
.cta{margin-top:8px}
.figcards{display:flex; gap:10px; margin:10px 0}
.figcard{flex:1; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:8px 8px 4px}
.figwrap{position:relative}
.figwrap img{width:100%; display:block}
.figwrap svg{position:absolute; inset:0; width:100%; height:100%}
.fm{fill:rgba(255,140,50,.42); stroke:#ffa14d; stroke-width:2.5}
.figcap{text-align:center; font-size:11px; font-weight:800; letter-spacing:.12em; color:var(--dim); padding:4px 0 2px}
.applogo{width:30px; height:30px; border-radius:8px}
.temporow{display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:4px}
.temporow span{font-size:11.5px; color:var(--dim); font-weight:700}
.temporow input.mini{width:46px; text-align:center; padding:9px 4px; font-size:15px;
  border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--text)}
.edxtra{
  margin:-6px 0 8px; padding:8px 10px; border:1px dashed var(--line); border-top:none;
  border-radius:0 0 12px 12px; background:rgba(255,255,255,.02);
  display:flex; flex-direction:column; gap:7px;
}

  width:100%; padding:10px; border-radius:10px; border:1px solid var(--line);

}
.ssbtn{
  align-self:flex-start; border:1px solid var(--line); background:var(--surface2);

  display:inline-block; margin-right:6px; padding:1px 7px; border-radius:7px;

}

  position:absolute; top:8px; right:10px; z-index:4;

  color:var(--neonB); background:rgba(8,14,24,.6);

  font-variant-numeric:tabular-nums; pointer-events:none;

.sheet .grab{width:44px;height:4px;border-radius:2px;background:var(--line);margin:4px auto 12px}
.sheet h2{font-size:19px; font-weight:800}

.mchips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px}
.mchip{font-size:12.5px; font-weight:700; padding:4px 11px; border-radius:999px; background:var(--surface2)}
.tips h3{font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--neonG); margin:14px 0 8px}
.tips ul{list-style:none}

.tips li:before{content:"›"; position:absolute; left:6px; top:6px; color:var(--amber); font-weight:800; font-size:16px}
.mistake{

<script>
"use strict";
function showErr(msg){
  try{
    const bar = document.getElementById("errbar");
    if(!bar) return;
    bar.classList.remove("hidden");
    bar.textContent = "Hata: " + msg + "  (kapatmak için dokun)";
    bar.onclick = ()=>bar.classList.add("hidden");
  }catch(_){}
}
window.addEventListener("error", e=>{
  let d = e.message || "bilinmeyen";
  if(e.filename || e.lineno) d += " @" + (e.filename||"").split("/").pop() + ":" + (e.lineno||"?") + ":" + (e.colno||"?");
  if(e.error && e.error.stack) d += " | " + String(e.error.stack).split("\n").slice(0,2).join(" ← ");
  showErr(d);
});
window.addEventListener("unhandledrejection", e=>{
  const r = e.reason || {};
  let d = "(promise) " + (r.message || String(r));
  if(r.stack) d += " | " + String(r.stack).split("\n").slice(0,2).join(" ← ");
  showErr(d);
});
/* ================= GÜVENLİ DEPOLAMA ================= */
const store = {
  mem:{},
  get(k){ try{ const v = localStorage.getItem(k); return v?JSON.parse(v):null }catch(e){ return this.mem[k]||null } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)) }catch(e){ this.mem[k]=v } }
};
/* ---- IndexedDB: katalog + GIF blobları cihazda kalıcı ---- */
const mediaDB = {
  _db: null,
  open(){
    return new Promise((res, rej)=>{
      if(this._db) return res(this._db);
      if(!window.indexedDB) return rej(new Error("IndexedDB yok"));
      const r = indexedDB.open("pht_media", 1);
      r.onupgradeneeded = ()=> r.result.createObjectStore("gifs");
      r.onsuccess = ()=>{ this._db = r.result; res(this._db) };
      r.onerror = ()=> rej(r.error);
    });
  },
  async get(k){
    try{
      const db = await this.open();
      return await new Promise(res=>{
        const t = db.transaction("gifs").objectStore("gifs").get(k);
        t.onsuccess = ()=>res(t.result || null); t.onerror = ()=>res(null);
      });
    }catch(e){ return null }
  },
  async set(k, v){
    const db = await this.open();
    return new Promise((res, rej)=>{
      const t = db.transaction("gifs","readwrite").objectStore("gifs").put(v, k);
      t.onsuccess = ()=>res(); t.onerror = ()=>rej(t.error);
    });
  },
  async clear(){
    try{
      const db = await this.open();
      return await new Promise(res=>{
        const t = db.transaction("gifs","readwrite").objectStore("gifs").clear();
        t.onsuccess = ()=>res(); t.onerror = ()=>res();
      });
    }catch(e){}
  },
  async del(k){
    try{
      const db = await this.open();
      return await new Promise(res=>{

      return await new Promise(res=>{
        const st = db.transaction("gifs").objectStore("gifs");
        const out = { n:0, bytes:0 };
        const req = st.openCursor();
        req.onsuccess = ()=>{
          const c = req.result;
          if(!c){ res(out); return }
          if(String(c.key).indexOf("gif_")===0 && c.value && c.value.blob){
            out.n++; out.bytes += c.value.blob.size || 0;
          }
          c.continue();
        };
        req.onerror = ()=>res(out);
      });
    }catch(e){ return { n:0, bytes:0 } }

      return await new Promise(res=>{

        req.onsuccess = ()=>{
          const c = req.result;
          if(!c){ res(); return }

          c.continue();
        };
        req.onerror = ()=>res();
      });
    }catch(e){}

const sleep = ms => new Promise(r=>setTimeout(r, ms));
/* Hız sınırı (HTTP 429) dahil uzun sabırlı fetch: bekleme geri sayımı log'a yazılır */
async function fetchJSONRate(url, hdrs, log){
  const waits = [0, 3000, 10000, 25000, 45000, 65000, 65000, 65000];
  let lastErr = null;
  for(let i=0; i<waits.length; i++){
    if(waits[i]){
      let left = Math.ceil(waits[i]/1000);
      while(left > 0){
        if(log) log(null, "⏳ Sunucu hız sınırı / bağlantı — " + left + " sn sonra otomatik devam…", true);
        await sleep(1000); left--;
      }
    }
    try{
      const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      const to = ctl ? setTimeout(()=>ctl.abort(), 20000) : 0;
      const r = await fetch(url, { headers: hdrs, signal: ctl ? ctl.signal : undefined });
      if(to) clearTimeout(to);
      if(r.status === 429) throw new Error("HTTP 429 (hız sınırı)");
      if(!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }catch(e){ lastErr = e }
  }
  throw lastErr || new Error("bağlantı hatası");
}
/* ---- zaman aşımı + yeniden denemeli fetch ---- */
async function fetchJSON(url, hdrs, tries, timeoutMs){
  tries = tries || 4; timeoutMs = timeoutMs || 20000;
  let lastErr = null;
  for(let i=0;i<tries;i++){
    try{
      const ctl = (typeof AbortController !== "undefined") ? new AbortController() : null;
      const to = ctl ? setTimeout(()=>ctl.abort(), timeoutMs) : 0;
      const r = await fetch(url, { headers: hdrs, signal: ctl ? ctl.signal : undefined });
      if(to) clearTimeout(to);
      if(!r.ok) throw new Error("HTTP " + r.status);
      return await r.json();
    }catch(e){
      lastErr = e;
      if(i < tries-1) await new Promise(rs=>setTimeout(rs, 700*(i+1)));
    }
  }
  throw lastErr || new Error("bağlantı hatası");
}

  let best = null, bs = 0;
  for(const e of EXERCISES){
    const name = edbNorm(e.rawName);
    if(name === qn) return e;
    let sc = 0;
    for(const t of qt){
      if(name.includes(" " + t + " ")) sc += 3;
      else if(name.includes(t)) sc += 1.5;
    }
    sc -= name.trim().split(" ").length * 0.15;

/* ---- GIF çözücü: kareleri açıp canvas'ta istenen hızda oynatır ---- */
function lzwDecode(minCode, data, pixCount){
  const out = new Uint8Array(pixCount);
  const prefix = new Int32Array(4096), suffix = new Uint8Array(4096), stack = new Uint8Array(4097);
  const clear = 1 << minCode, eoi = clear + 1;
  let size = minCode + 1, dictSize = eoi + 1, prev = -1, first = 0;
  let acc = 0, bits = 0, pos = 0, op = 0;
  while(op < pixCount){
    while(bits < size){ if(pos >= data.length) return out; acc |= data[pos++] << bits; bits += 8 }
    let code = acc & ((1 << size) - 1); acc >>= size; bits -= size;
    if(code === clear){ size = minCode + 1; dictSize = eoi + 1; prev = -1; continue }
    if(code === eoi) break;
    const inCode = code;
    let sp = 0;
    if(code >= dictSize){
      if(code > dictSize || prev === -1) return out;
      stack[sp++] = first; code = prev;
    }
    while(code > eoi){ stack[sp++] = suffix[code]; code = prefix[code] }
    first = code;
    stack[sp++] = first;
    while(sp && op < pixCount) out[op++] = stack[--sp];
    if(prev !== -1 && dictSize < 4096){
      prefix[dictSize] = prev; suffix[dictSize] = first; dictSize++;
      if(dictSize === (1 << size) && size < 12) size++;
    }
    prev = inCode;
  }
  return out;
}
function parseGIF(u8){
  if(!(u8[0] === 71 && u8[1] === 73 && u8[2] === 70)) throw new Error("GIF değil");
  let p = 6;
  const rd16 = ()=>{ const v = u8[p] | (u8[p+1] << 8); p += 2; return v };
  const W = rd16(), H = rd16();
  const pf = u8[p++]; p += 2;
  let GCT = null;
  if(pf & 0x80){ const n = 2 << (pf & 7); GCT = u8.subarray(p, p + 3*n); p += 3*n }
  const frames = [];
  let delay = 100, trans = -1, disposal = 0;
  const full = new Uint8ClampedArray(W * H * 4);
  let prevSnap = null;
  while(p < u8.length){
    const b = u8[p++];
    if(b === 0x3B) break;
    if(b === 0x21){
      const label = u8[p++];
      if(label === 0xF9){
        p++;
        const fl = u8[p++];
        delay = (u8[p] | (u8[p+1] << 8)) * 10; p += 2;
        if(!delay || delay < 20) delay = 100;
        const ti = u8[p++]; p++;
        disposal = (fl >> 2) & 7;
        trans = (fl & 1) ? ti : -1;
      } else {
        let s; while((s = u8[p++])) p += s;
      }
      continue;
    }
    if(b === 0x2C){
      const L = rd16(), T = rd16(), w = rd16(), h = rd16();
      const f = u8[p++];
      let pal = GCT;
      if(f & 0x80){ const n = 2 << (f & 7); pal = u8.subarray(p, p + 3*n); p += 3*n }
      const interlace = !!(f & 0x40);
      const minCode = u8[p++];
      let total = 0, q = p, s;
      while(q < u8.length && (s = u8[q])){ total += s; q += 1 + s }
      const data = new Uint8Array(total);
      let di = 0;
      while((s = u8[p++])){ data.set(u8.subarray(p, p + s), di); di += s; p += s }
      let idx = lzwDecode(minCode, data, w * h);
      if(interlace){
        const de = new Uint8Array(w * h); let ri = 0;
        for(const st of [[0,8],[4,8],[2,4],[1,2]])
          for(let y = st[0]; y < h; y += st[1]){ de.set(idx.subarray(ri*w, ri*w + w), y*w); ri++ }
        idx = de;
      }
      if(disposal === 3) prevSnap = full.slice();
      for(let y = 0; y < h; y++){
        const ry = T + y; if(ry >= H) break;
        for(let x = 0; x < w; x++){
          const ci = idx[y*w + x];
          if(ci === trans) continue;
          const rx = L + x; if(rx >= W) continue;
          const o = (ry*W + rx) * 4, c = ci * 3;
          full[o] = pal[c]; full[o+1] = pal[c+1]; full[o+2] = pal[c+2]; full[o+3] = 255;
        }
      }
      frames.push({ delay, data: full.slice() });
      if(disposal === 2){
        const ww = Math.min(w, W - L);
        for(let y = 0; y < h && T + y < H; y++){
          const o = ((T + y) * W + L) * 4;
          full.fill(0, o, o + ww * 4);
        }
      } else if(disposal === 3 && prevSnap){ full.set(prevSnap) }
      disposal = 0; trans = -1;
    }
  }
  if(!frames.length) throw new Error("kare yok");
  return { width: W, height: H, frames };
}
function createAnim(host, ex){
  let destroyed = false, objUrl = null, raf = 0;
  const api = {
    _speed: 1, _paused: false,
    set speed(v){ this._speed = v || 1 },
    get speed(){ return this._speed },
    set paused(v){ this._paused = !!v },
    get paused(){ return this._paused },
    destroy(){ destroyed = true; cancelAnimationFrame(raf); if(objUrl) URL.revokeObjectURL(objUrl); host.innerHTML = "" },
    drive(){}, release(){}, setT(){}, set startTs(v){}, phases: { total: 3200 }
  };
  function fail(){
    if(destroyed) return;
    host.innerHTML = '<div class="gif-missing">GIF için internet gerekli.<br>Offline izlemek için hareket detayından ⬇ GIF\'i indir.</div>';
  }
  function showImg(srcU, onFail){
    if(destroyed) return;
    const img = document.createElement("img");
    img.alt = ex.name;
    img.onerror = onFail || fail;
    img.onload = ()=>{ if(!destroyed){ host.innerHTML = ""; host.appendChild(img) } };
    img.src = srcU;
  }
  function fallbackImg(){
    if(destroyed) return;
    if(EMBEDDED_GIFS && EMBEDDED_GIFS[ex.id]){ showImg(EMBEDDED_GIFS[ex.id], ()=>showImg(ex.gif)); return }
    mediaDB.get("gif_" + ex.id).then(rec=>{
      if(destroyed) return;
      if(rec && rec.blob){ objUrl = URL.createObjectURL(rec.blob); showImg(objUrl, ()=>showImg(ex.gif)) }
      else showImg(ex.gif);
    }).catch(()=>showImg(ex.gif));
  }
  function playCanvas(buf){
    const gif = parseGIF(new Uint8Array(buf));
    if(gif.width * gif.height * gif.frames.length * 4 > 90e6) throw new Error("bellek");
    const cv = document.createElement("canvas");
    cv.width = gif.width; cv.height = gif.height;
    cv.style.width = "100%"; cv.style.display = "block"; cv.style.background = "#fff";
    const ctx = cv.getContext("2d");
    const imgs = gif.frames.map(fr=>{
      const d = ctx.createImageData(gif.width, gif.height);
      d.data.set(fr.data);
      return d;
    });
    host.innerHTML = ""; host.appendChild(cv);
    let fi = 0, accMs = 0, last = performance.now(), driven = false;
    /* kare zaman haritası: tempo güdümü için */
    const cum = []; let D = 0;
    for(const fr of gif.frames){ cum.push(D); D += fr.delay }
    ctx.putImageData(imgs[0], 0, 0);
    /* Tempo güdümü: p (0..1) hareket ilerlemesi -> GIF'in aynı oranı */
    api.drive = p => {
      driven = true;
      const tt = Math.max(0, Math.min(0.999, p)) * D;
      let ni = 0;
      while(ni < gif.frames.length - 1 && cum[ni + 1] <= tt) ni++;
      if(ni !== fi){ fi = ni; ctx.putImageData(imgs[fi], 0, 0) }
    };
    api.release = ()=>{ if(driven){ driven = false; accMs = 0; last = performance.now() } };
    const loop = now => {
      if(destroyed) return;
      try{
        const dt = (api._paused || driven) ? 0 : Math.min(200, now - last);
        last = now;
        accMs += dt * api._speed;
        let guard = 0;
        while(accMs >= gif.frames[fi].delay && guard++ < 80){
          accMs -= gif.frames[fi].delay;
          fi = (fi + 1) % gif.frames.length;
        }
        if(guard) ctx.putImageData(imgs[fi], 0, 0);
      }catch(err){ fallbackImg(); return }
      raf = requestAnimationFrame(loop);
    };
    raf = requestAnimationFrame(loop);
  }
  (async ()=>{
    try{
      let buf = null;
      if(EMBEDDED_GIFS && EMBEDDED_GIFS[ex.id]){
        const bin = atob(EMBEDDED_GIFS[ex.id].split(",")[1]);
        const u = new Uint8Array(bin.length);
        for(let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
        buf = u.buffer;
      } else {
        const rec = await mediaDB.get("gif_" + ex.id).catch(()=>null);
        if(rec && rec.blob && rec.blob.arrayBuffer) buf = await rec.blob.arrayBuffer();
        else {
          const r = await fetch(ex.gif);
          if(!r.ok) throw new Error("HTTP " + r.status);
          buf = await r.arrayBuffer();
        }
      }
      if(destroyed) return;
      playCanvas(buf);
    }catch(e){ fallbackImg() }
  })();
  return api;
}

const EDB_HOST = "edb-with-gifs-and-images-by-ascendapi.p.rapidapi.com";
const EDB_FREE_BASES = ["https://oss.exercisedb.dev","https://exercisedb-api.vercel.app"];
let edbRunning = false;
async function edbLoadCatalog(base, hdrs, log){
  /* Sunucu, sayfa ilerletme parametresini yok sayabiliyor (hep 1. sayfa!).
     Bu yüzden: her sayfada YENİ benzersiz kayıt sayılır; ilerleme yoksa
     sayfalama yöntemi değiştirilir (cursor -> offset -> page). */
  const MODES = ["after","cursor","offset","page"];
  let items = [], cursor = null, mode = 0, pageNo = 1, broke = null;
  const seen = new Set();
  let prog = null;
  try{ prog = await mediaDB.get("__catalog_progress") }catch(e){}
  if(prog && prog.v === 2 && prog.base === base && Array.isArray(prog.items) && prog.items.length){
    items = dedupeItems(prog.items);
    for(const it of items) seen.add(it.id);
    cursor = prog.cursor || null;
    mode = prog.mode || 0;
    pageNo = prog.pageNo || Math.max(1, Math.round(items.length/25));
    log(null, "▶ Kaldığı yerden devam: " + items.length + " hareket zaten inmişti (" + MODES[mode] + ").");
  }
  const addAll = d => {
    let nw = 0;
    for(const e of d){
      const id = e.exerciseId;
      if(!id || seen.has(id)) continue;
      seen.add(id);
      items.push({
        id, name: e.name || "", gif: e.gifUrl || "",
        equipments: e.equipments || [], bodyParts: e.bodyParts || [],
        targetMuscles: e.targetMuscles || [], secondaryMuscles: e.secondaryMuscles || [],
        instructions: e.instructions || []
      });
      nw++;
    }
    return nw;
  };
  const urlFor = () => {
    if(mode === 0) return base + "/api/v1/exercises?limit=100" +
      (cursor ? "&after=" + encodeURIComponent(cursor) : "");
    if(mode === 1) return base + "/api/v1/exercises?limit=100" +
      (cursor ? "&cursor=" + encodeURIComponent(cursor) : "");
    if(mode === 2) return base + "/api/v1/exercises?limit=100&offset=" + items.length;
    return base + "/api/v1/exercises?limit=100&page=" + (pageNo + 1);
  };
  let guard = 0, total = 0;
  while(guard++ < 400){
    let r;
    try{ r = await fetchJSONRate(urlFor(), hdrs, log) }
    catch(err){ broke = err; break }
    const d = (r && r.data) || [];
    const meta = (r && (r.meta || r.metadata)) || {};
    total = meta.totalExercises || meta.total || total;
    const added = addAll(d);
    if(meta.nextCursor) cursor = meta.nextCursor;
    if(added > 0){
      pageNo++;
      log(null, "Katalog indiriliyor: " + items.length + (total ? "/" + total : "") + " hareket…", true);
      try{ await mediaDB.set("__catalog_progress", { v:2, base, cursor, mode, pageNo, items, when: Date.now() }) }catch(e){}
      if(d.length === 0 || meta.hasNextPage === false){ break }
      await sleep(1500);
      continue;
    }
    /* bu sayfa hiç YENİ kayıt getirmedi -> sayfalama yöntemi değiştir */
    if(mode < MODES.length - 1){
      mode++;
      log(null, "Sunucu " + MODES[mode-1] + " ile ilerlemiyor; \"" + MODES[mode] + "\" yöntemi deneniyor…");
      await sleep(1200);
      continue;
    }
    /* hiçbir yöntem yeni kayıt getirmiyor -> sunucunun verebileceği bitti */
    log(null, "Sunucudan alınabilen tüm benzersiz kayıtlar alındı (" + items.length + ").");
    break;
  }
  items = dedupeItems(items);
  if(broke){
    try{ await mediaDB.set("__catalog_progress", { v:2, base, cursor, mode, pageNo, items, when: Date.now() }) }catch(e){}
    if(items.length >= 150){
      log(null, "⚠ İndirme " + items.length + " harekette durdu (" + (broke.message||broke) + ").");
      log(null, "İlerleme kaydedildi — \"Kataloğu indir\"e tekrar basınca kaldığı yerden devam eder.");
      return items;
    }
    throw broke;
  }
  try{ await mediaDB.del("__catalog_progress") }catch(e){}
  return items;
}

async function edbSync(log){
  if(edbRunning) return; edbRunning = true;
  try{
    const key = (store.get("pht_edb_key") || "").trim();
    const bases = key ? ["https://" + EDB_HOST] : EDB_FREE_BASES;
    const hdrs = key ? { "X-RapidAPI-Key": key, "X-RapidAPI-Host": EDB_HOST } : {};
    let items = null, lastErr = null;
    for(const base of bases){
      log(null, "Sunucu deneniyor: " + base.replace("https://","") + "…");
      try{
        items = await edbLoadCatalog(base, hdrs, log);
        if(items && items.length) break;
        items = null;
      }catch(err){ lastErr = err; log(null, "✗ Erişilemedi: " + base.replace("https://","")) }
    }
    if(!items || !items.length){
      log(null, "✗ Hiçbir sunucuya erişilemedi" + (lastErr ? " ("+(lastErr.message||lastErr)+")" : "") + ".");

    items = dedupeItems(items);
    await mediaDB.set("__catalog_full", { when: Date.now(), items });

function beep(freq, dur, vol){
  try{
    const ctx = beep.ctx || (beep.ctx = new (window.AudioContext||window.webkitAudioContext)());
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.frequency.value = freq; g.gain.value = vol;
    o.start(); o.stop(ctx.currentTime + dur);
  }catch(e){}
}

function figPanel(side, img, act){
  const shapes = FIG_SHAPES[side];
  let ells = "";
  for(const m in shapes){
    if(!act.has(m)) continue;
    for(const s of shapes[m]){
      ells += `<ellipse cx="${s[0]}" cy="${s[1]}" rx="${s[2]}" ry="${s[3]}" transform="rotate(${s[4]} ${s[0]} ${s[1]})" class="fm"/>`;
    }
  }
  return `<div class="figcard">
    <div class="figwrap">
      <img src="${img}" alt="">
      <svg viewBox="0 0 310 520" preserveAspectRatio="xMidYMid meet">${ells}</svg>
    </div>
    <div class="figcap">${side === "front" ? "ÖN" : "ARKA"}</div>
  </div>`;
}
function muscleCards(ex){
  const act = chartMuscles(ex);
  return `<div class="figcards">${figPanel("front", FIG_FRONT, act)}${figPanel("back", FIG_BACK, act)}</div>`;
}
function bodyMaps(sel){
  const {front, back} = bodySVGs(id=>id===sel, true);
  return `<div class="mcards mapcards">
    <div class="mcard"><div class="mlbl">ÖN</div>${front}</div>
    <div class="mcard"><div class="mlbl">ARKA</div>${back}</div>
  </div>`;
}

const DAYS = [
  { id:1, name:"Gün 1 — Bacak · Kalça · Core", colorHex:"#d9534a", note:"Alt vücut + core" },
  { id:2, name:"Gün 2 — Üst Vücut", colorHex:"#4a7fd4", note:"İtiş / çekiş dengeli" },
  { id:3, name:"Gün 3 — Full Body", colorHex:"#57a06a", note:"Bileşik hareketler" }
];
const DAY_QUERIES = {
  1:["kettlebell goblet squat","dumbbell romanian deadlift","suspended split squat","barbell glute bridge","kettlebell swing","dumbbell standing calf raise","air bike","russian twist","dead bug"],
  2:["dumbbell bench press","dumbbell bent over row","dumbbell standing overhead press","dumbbell lateral raise","dumbbell pullover","band pull apart","dumbbell biceps curl","dumbbell lying triceps extension","band face pull"],
  3:["kettlebell deadlift","dumbbell push press","dumbbell lunge","cable pulldown","push-up","kettlebell sumo high pull","dumbbell one arm row","medicine ball slam","dumbbell hammer curl","bench dip","band standing twist","lying leg raise","dumbbell standing calf raise","farmers walk"]
};
/* Her günde bir süper set çifti: bu sorgu, listedeki bir sonrakiyle bağlanır */
const DAY_SS = {
  1:"kettlebell goblet squat",       /* + romanian deadlift (quad ↔ arka zincir) */
  2:"dumbbell bench press",          /* + bent over row (itiş ↔ çekiş) */
  3:"dumbbell hammer curl"           /* + bench dip (biceps ↔ triceps) */
};
let BUILTIN_TEMPLATES = [];
function rebuildBuiltins(){
  BUILTIN_TEMPLATES = DAYS.map(d=>{
    const items = DAY_QUERIES[d.id].map(q=>({q, e:findEx(q)})).filter(x=>x.e)
      .map(x=>({ex:x.e.id, sets:3, reps:12, _q:x.q}));
    const idx = items.findIndex(it=>it._q === DAY_SS[d.id]);
    if(idx >= 0 && idx < items.length - 1) items[idx].ss = true;
    items.forEach(it=>delete it._q);
    return { id:"day"+d.id, name:d.name, note:d.note, colorHex:d.colorHex, builtin:true, items };
  }).filter(t=>t.items.length >= 4);
}
const TPL_COLORS = ["#c95f8e","#7a5fd4","#3aa7a0","#c9803a","#5f9ad4","#a3c24d"];
const pickColor = i => TPL_COLORS[i % TPL_COLORS.length];
function customTemplates(){ return store.get("pht_templates") || [] }
function saveCustomTemplates(l){ store.set("pht_templates", l) }
function allTemplates(){ return BUILTIN_TEMPLATES.concat(customTemplates()) }
function tplById(id){ return allTemplates().find(t=>t.id===id) }
const clampN = (v, lo, hi, def) => { const n = parseInt(v,10); return isNaN(n) ? def : Math.max(lo, Math.min(hi, n)) };
function exportTemplate(t){
  const data = { app:"PersonalHomeTrainer", type:"pht-template", version:2,
    template:{ name:t.name, note:t.note||"", items:t.items } };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = (t.name||"sablon").replace(/[\\/:*?"<>|]/g,"").trim().replace(/\s+/g,"_") + ".pht.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
}
function importTemplateFile(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const d = JSON.parse(r.result);
      const t = d && d.template ? d.template : d;
      if(!t || !t.name || !Array.isArray(t.items)) throw new Error("Şablon biçimi tanınmadı");
      const items = t.items.filter(it=>it && exById(it.ex)).map(it=>({
        ex: it.ex, sets: clampN(it.sets,1,10,3), reps: clampN(it.reps,1,300,12),
        timed: it.timed ? true : undefined,
        tempo: (Array.isArray(it.tempo) && it.tempo.length === 4)
          ? it.tempo.map(v=>Math.max(0, Math.min(10, parseFloat(v) || 0))) : undefined,
        phase: (it.phase >= 0 && it.phase < 4) ? (it.phase|0) : undefined,
        ss: it.ss ? true : undefined }));
      const skipped = t.items.length - items.length;
      if(!items.length) throw new Error("Dosyadaki hareketler katalogda bulunamadı. Önce Ayarlar'dan kataloğu indir.");
      const list = customTemplates();
      list.push({ id:"c"+Date.now(), name:String(t.name).slice(0,60), note:String(t.note||"").slice(0,120),
        colorHex:pickColor(list.length), items });
      saveCustomTemplates(list);
      renderProgram();
      alert("Şablon içe aktarıldı: " + t.name + (skipped ? " ("+skipped+" hareket bulunamadı, atlandı)" : ""));
    }catch(err){ alert("İçe aktarma hatası: " + (err && err.message || err)) }
  };
  r.onerror = ()=>alert("Dosya okunamadı.");
  r.readAsText(file);
}

/* ================= KOÇ ŞABLONU TOHUMU =================
   Bir defaya mahsus, katalog yüklendiğinde "Şablonlarım"a kurulur —
   normal içe aktarılmış şablon gibi silinebilir/düzenlenebilir.
   Silinirse bir daha otomatik kurulmaz (bayrak cihazda tutulur). */
/* Eski gömülü koç şablonlarını (Koç — Gün A/B (Ev)) tek seferlik kaldır */
function seedCoachTemplates(){
  if(store.get("pht_koc_removed")) return;
  const l = customTemplates();
  const f = l.filter(t=>t.name !== "Koç — Gün A (Ev)" && t.name !== "Koç — Gün B (Ev)");
  if(f.length !== l.length) saveCustomTemplates(f);
  store.set("pht_koc_removed", 1);
}

/* ---- ortak arama: ad + Türkçe eş anlamlılar + kas + ekipman ---- */
function matchesQuery(ex, q){
  let qq = trLow(String(q||"").trim());
  if(!qq) return true;
  for(const k in SEARCH_SYN){ if(qq.includes(k)) qq += " " + SEARCH_SYN[k] }
  const hay = trLow(ex.name + " " + ex.rawName + " " + ex.eq.join(" ") + " " +
    ex.muscles.join(" ") + " " + ex.targets.join(" ") + " " + ex.bodyParts.join(" "));
  return trLow(String(q).trim()).split(/\s+/).every(t=>{
    let tt = t;
    for(const k in SEARCH_SYN){ if(t.includes(k)) tt += " " + SEARCH_SYN[k] }
    return tt.split(/\s+/).some(w=>hay.includes(w));
  });
}
function eqList(){
  const pref = ["Vücut ağırlığı","Dumbbell","Kettlebell","Cable","Bant","Barbell","EZ Bar","Smith","Makine","Sağlık topu","Pilates topu","Halat","Ek ağırlık","Destekli"];
  const all = new Set();
  for(const e of EXERCISES) for(const q of e.eq) all.add(q);
  const rest = [...all].filter(x=>!pref.includes(x)).sort((a,b)=>a.localeCompare(b,"tr"));
  return ["Hepsi"].concat(pref.filter(x=>all.has(x))).concat(rest);
}

/* ---- PROGRAM ---- */
let editor = null;
function tplCard(t, open){
  const tags = groupTags(t.items);
  const rows = t.items.map((it, i)=>{
    const e = exById(it.ex);
    if(!e) return "";
    const tg = tags[i] ? tags[i] + " · " : "";
    return exRowHTML(e, t.colorHex, `${tg}${it.sets} × ${it.reps}${it.timed?" sn":""}`);
  }).join("");
  const hasSS = Object.keys(tags).length > 0;
  const btns = (t.builtin
    ? `<button data-a="copy" data-t="${t.id}">⧉ Kopyala & Düzenle</button>
       <button data-a="export" data-t="${t.id}">⇪ Dışa aktar</button>`
    : `<button data-a="edit" data-t="${t.id}">✎ Düzenle</button>
       <button data-a="export" data-t="${t.id}">⇪ Dışa aktar</button>
       <button class="warn" data-a="del" data-t="${t.id}">Sil</button>`)
    + `<button data-a="gifs" data-t="${t.id}">⬇ GIF'leri indir</button>`;
  return `<div class="daycard ${open?"open":""}" id="tc-${t.id}">
    <div class="dayhead" data-t="${t.id}">
      <div class="plate" style="border-color:${t.colorHex}"></div>
      <div class="t"><b>${esc(t.name)}</b><small>${t.note?esc(t.note)+" · ":""}${t.items.length} hareket</small></div>
      <div class="chev">›</div>
    </div>
    <div class="exlist">${rows}${hasSS ? `<div class="hint" style="text-align:left;padding:4px 14px">🔗 Aynı harfli hareketler süper set: ardışık yapılır (geçiş ${SS_TRANS} sn), tur arası ${SS_REST} sn dinlenilir.</div>` : ""}<div class="tplbtns">${btns}</div></div>
  </div>`;
}
function renderProgram(){
  const v = document.getElementById("view-program");
  if(editor){ renderEditor(v); return }
  if(!EXERCISES.length){
    v.innerHTML = `<div class="eyebrow">Başlarken</div>` + ctaHTML("Hareket kataloğu henüz indirilmedi");
    return;
  }
  const customs = customTemplates();
  v.innerHTML = `
    <div class="eyebrow">Önerilen şablonlar</div>
    ${BUILTIN_TEMPLATES.map(t=>tplCard(t,false)).join("")}
    <div class="eyebrow">Şablonlarım</div>
    ${customs.length
      ? customs.map(t=>tplCard(t,false)).join("")
      : `<div class="hcard" style="color:var(--dim);font-size:13.5px">
           Henüz özel şablonun yok. Yeni oluşturabilir ya da koçunun gönderdiği
           <b style="color:var(--amber)">.pht.json</b> dosyasını içe aktarabilirsin.</div>`}
    <div class="pctl" style="margin-top:12px">
      <button class="btn primary" id="tpl-new">＋ Yeni şablon</button>
      <button class="btn ghost" id="tpl-import">⇩ Dosyadan içe aktar</button>
    </div>
    <input type="file" id="tpl-file" accept=".json,application/json" class="hidden">
    <div class="eyebrow">Nasıl ilerlemeli?</div>
    <div class="hcard" style="font-size:13.5px;color:var(--dim)">
      Günler arasında en az 1 gün dinlen. Hedef tekrarı tüm setlerde temiz formla tamamlayınca
      ağırlığı bir kademe artır (progressive overload). Isınma: 5 dk hafif kardiyo + ilk hareketten 1 hafif set.
    </div>`;
  v.querySelectorAll(".dayhead").forEach(h=>h.addEventListener("click",()=>{
    document.getElementById("tc-"+h.dataset.t).classList.toggle("open");
  }));
  bindExRows(v);
  v.querySelectorAll(".tplbtns button").forEach(b=>b.addEventListener("click", e=>{
    e.stopPropagation();
    const t = tplById(b.dataset.t), a = b.dataset.a;
    if(!t) return;
    if(a==="export") exportTemplate(t);
    if(a==="edit") openEditor(t);
    if(a==="copy"){
      const list = customTemplates();
      const copy = { id:"c"+Date.now(), name:t.name+" (kopya)", note:t.note||"",
        colorHex:pickColor(list.length), items:t.items.map(it=>({ex:it.ex, sets:it.sets, reps:it.reps})) };
      list.push(copy); saveCustomTemplates(list);
      openEditor(copy);
    }
    if(a==="del" && confirm('"'+t.name+'" silinsin mi?')){
      saveCustomTemplates(customTemplates().filter(x=>x.id!==t.id));
      renderProgram();
    }
    if(a==="gifs"){
      b.disabled = true;
      (async ()=>{
        let ok = 0;
        for(let i=0; i<t.items.length; i++){
          b.textContent = "⬇ " + (i+1) + "/" + t.items.length + "…";
          const e2 = exById(t.items[i].ex);
          if(e2 && await cacheGif(e2)) ok++;
        }
        b.textContent = ok === t.items.length ? "✓ GIF'ler indirildi" : "✓ " + ok + "/" + t.items.length + " indirildi";
        b.disabled = false;
      })();
    }
  }));
  document.getElementById("tpl-new").addEventListener("click", ()=>openEditor(null));
  const fileInp = document.getElementById("tpl-file");
  document.getElementById("tpl-import").addEventListener("click", ()=>fileInp.click());
  fileInp.addEventListener("change", ()=>{
    if(fileInp.files && fileInp.files[0]) importTemplateFile(fileInp.files[0]);
    fileInp.value = "";
  });
}
/* ---- ŞABLON EDİTÖRÜ: arama + kas haritası + ekipman filtresi ---- */
function openEditor(t){
  editor = t ? {
    id: t.id, name: t.name, note: t.note || "", eq: "Hepsi", m: null, q: "",
    items: Object.fromEntries(t.items.map(it=>[it.ex, {sets:it.sets, reps:it.reps, timed:it.timed, tempo:it.tempo, phase:it.phase, ss:it.ss}])),
    order: t.items.map(it=>it.ex)
  } : { id:null, name:"", note:"", eq:"Hepsi", m:null, q:"", items:{}, order:[] };
  renderProgram();
  window.scrollTo(0,0);
}
function edFiltered(){
  return EXERCISES.filter(e=>
    (editor.eq==="Hepsi" || e.eq.includes(editor.eq)) &&
    (!editor.m || chartMuscles(e).has(editor.m)) &&
    matchesQuery(e, editor.q) &&
    !editor.items[e.id]);
}
function edPickRow(e, sel, tag, isLast){
  const it = editor.items[e.id];
  if(!sel){
    return `<div class="pickrow" data-ex="${e.id}">
      <div class="n"><b>${esc(e.name)}</b><small>${e.muscles.join(" · ")} · ${e.eq.join(" + ")}</small></div>
      <span class="x" style="font-size:18px">＋</span>
    </div>`;
  }
  const tv = it.tempo || DEFAULT_TEMPO;
  const ph = (it.phase !== undefined && it.phase !== null) ? it.phase : autoPhase(e);
  const P = PHASE_SETS[ph];
  return `<div class="pickrow sel" data-ex="${e.id}">
    <div class="n">${tag ? `<span class="sstag">${tag}</span>` : ""}<b>${esc(e.name)}</b><small>${e.muscles.join(" · ")}</small></div>
    <input class="mini" data-f="sets" inputmode="numeric" value="${it.sets}"><span class="x">set ×</span>
    <input class="mini" data-f="reps" inputmode="numeric" value="${it.reps}"><span class="x">${it.timed?"sn":"tekrar"}</span>
  </div>
  <div class="edxtra" data-ex="${e.id}">
    ${it.timed ? "" : `
    <select class="phsel">${PHASE_SETS.map((pp,i)=>`<option value="${i}" ${i===ph?"selected":""}>${pp.name}</option>`).join("")}</select>
    <div class="temporow">
      <span>${P.f[0]}</span><input class="mini tpi" data-i="0" inputmode="decimal" value="${tv[0]}">
      <span>${P.f[1]}</span><input class="mini tpi" data-i="1" inputmode="decimal" value="${tv[1]}">
      <span>${P.f[2]}</span><input class="mini tpi" data-i="2" inputmode="decimal" value="${tv[2]}">
      <span>Ara</span><input class="mini tpi" data-i="3" inputmode="decimal" value="${tv[3]}">
    </div>`}
    ${isLast ? "" : `<button class="ssbtn ${it.ss?"on":""}">${it.ss?"🔗 Süper set: sonrakiyle BAĞLI":"○ Sonrakiyle süper set yap"}</button>`}
  </div>`;
}
function edListHTML(){
  const selIds = editor.order.filter(id=>editor.items[id]);
  const pseudo = selIds.map(id=>({ ex:id, ss: !!editor.items[id].ss }));
  const tags = groupTags(pseudo);
  const selRows = selIds.map((id, i)=>{
    const e = exById(id);
    return e ? edPickRow(e, true, tags[i], i === selIds.length - 1) : "";
  }).join("");
  const rest = edFiltered().slice(0, 80).map(e=>edPickRow(e, false));
  return (selRows ? `<div class="eyebrow" style="margin-top:6px">Seçilenler — ${editor.order.length}</div>${selRows}` : "") +
    `<div class="eyebrow" style="margin-top:6px">Katalog${editor.q?` — "${esc(editor.q)}"`:""} (ilk 80 sonuç)</div>` +
    (rest.join("") ||
     `<div class="empty">Bu filtrelerle sonuç yok. Aramayı veya filtreleri gevşet.</div>`);
}
function edBindList(container){
  container.querySelectorAll(".edxtra").forEach(x=>{
    const id = x.dataset.ex;
    const sel = x.querySelector(".phsel");
    if(sel) sel.addEventListener("change", e=>{
      e.stopPropagation();
      if(editor.items[id]) editor.items[id].phase = parseInt(sel.value, 10) || 0;
      refreshEdList();
    });
    x.querySelectorAll(".tpi").forEach(inp=>{
      inp.addEventListener("click", e=>e.stopPropagation());
      inp.addEventListener("change", e=>{
        e.stopPropagation();
        if(!editor.items[id]) return;
        const t = (editor.items[id].tempo || DEFAULT_TEMPO).slice();
        const vv = parseFloat(inp.value.replace(",","."));
        const i = parseInt(inp.dataset.i, 10);
        t[i] = isNaN(vv) ? DEFAULT_TEMPO[i] : Math.max(0, Math.min(10, vv));
        editor.items[id].tempo = t;
        inp.value = t[i];
      });
    });
    const ssb = x.querySelector(".ssbtn");
    if(ssb) ssb.addEventListener("click", e=>{
      e.stopPropagation();
      if(editor.items[id]) editor.items[id].ss = !editor.items[id].ss;
      refreshEdList();
    });
  });
  container.querySelectorAll(".pickrow").forEach(r=>{
    r.addEventListener("click", e=>{
      if(e.target.classList.contains("mini")) return;
      const id = r.dataset.ex, ex = exById(id);
      if(editor.items[id]){ delete editor.items[id]; editor.order = editor.order.filter(x=>x!==id) }
      else { editor.items[id] = { sets:3, reps: ex.reps || 12 }; editor.order.push(id) }
      refreshEdList();
      const cnt = document.getElementById("ed-count");
      if(cnt) cnt.textContent = Object.keys(editor.items).length + " hareket seçili";
    });
    r.querySelectorAll(".mini").forEach(inp=>{
      inp.addEventListener("click", e=>e.stopPropagation());
      inp.addEventListener("change", ()=>{
        const id = r.dataset.ex, f = inp.dataset.f;
        if(!editor.items[id]) return;
        const val = f==="sets" ? clampN(inp.value,1,10,3) : clampN(inp.value,1,300,12);
        editor.items[id][f] = val; inp.value = val;
      });
    });
  });
}
function refreshEdList(){
  const el = document.getElementById("ed-list");
  if(el){ el.innerHTML = edListHTML(); edBindList(el) }
}
function renderEditor(v){
  const selCount = Object.keys(editor.items).length;
  v.innerHTML = `
    <div class="eyebrow">${editor.id ? "Şablonu düzenle" : "Yeni şablon"} — <span id="ed-count">${selCount} hareket seçili</span></div>
    <div class="prepbox">
      <label>Şablon adı</label>
      <input id="tpl-name" placeholder="örn. Koç Programı A" value="${esc(editor.name)}" autocomplete="off">
      <label style="margin-top:10px">Not (isteğe bağlı)</label>
      <input id="tpl-note" placeholder="örn. Pzt-Çar-Cum · 4 hafta" value="${esc(editor.note)}" autocomplete="off">
    </div>
    <div class="eyebrow">Hareket ara</div>
    <div class="searchbox"><input id="ed-q" type="search" placeholder="İsimle ara… (örn. squat, şınav, RDL)" value="${esc(editor.q)}" autocomplete="off"></div>
    <div class="eyebrow">Ekipman</div>
    <div class="chips">${eqList().map(g=>`<button class="chip ${g===editor.eq?"on":""}" data-g="${g}">${g}</button>`).join("")}</div>
    <div class="eyebrow">Kas grubuna dokun${editor.m?` — ${MUSCLE_TR[editor.m]}`:""}</div>
    ${bodyMaps(editor.m)}
    <div id="ed-list">${edListHTML()}</div>
    <div class="pctl" style="margin-top:12px">
      <button class="btn primary" id="tpl-save">✔ Kaydet</button>
      <button class="btn ghost small" id="tpl-cancel">İptal</button>
    </div>
    <div class="hint">Kaydettikten sonra ⇪ Dışa aktar ile dosya olarak paylaşabilirsin.</div>`;
  const nameInp = document.getElementById("tpl-name");
  const noteInp = document.getElementById("tpl-note");
  nameInp.addEventListener("input", ()=> editor.name = nameInp.value);
  noteInp.addEventListener("input", ()=> editor.note = noteInp.value);
  const qInp = document.getElementById("ed-q");
  qInp.addEventListener("input", ()=>{ editor.q = qInp.value; refreshEdList() });
  v.querySelectorAll(".chip[data-g]").forEach(c=>c.addEventListener("click", ()=>{
    editor.eq = c.dataset.g; renderProgram();
  }));
  v.querySelectorAll("[data-m]").forEach(el=>el.addEventListener("click", ()=>{
    editor.m = (editor.m === el.dataset.m) ? null : el.dataset.m;
    renderProgram();
  }));
  edBindList(document.getElementById("ed-list"));
  document.getElementById("tpl-cancel").addEventListener("click", ()=>{ editor = null; renderProgram() });
  document.getElementById("tpl-save").addEventListener("click", ()=>{
    const name = (editor.name||"").trim();
    if(!name){ alert("Şablona bir ad ver."); nameInp.focus(); return }
    const items = editor.order.filter(id=>editor.items[id]).map(id=>({
      ex:id, sets:clampN(editor.items[id].sets,1,10,3), reps:clampN(editor.items[id].reps,1,300,12),
      timed: editor.items[id].timed ? true : undefined,
      tempo: editor.items[id].tempo,
      phase: editor.items[id].phase,
      ss: editor.items[id].ss ? true : undefined }));
    if(!items.length){ alert("En az bir hareket seç."); return }
    if(items.length && items[items.length-1].ss) items[items.length-1].ss = undefined;
    const listC = customTemplates();
    if(editor.id && listC.some(x=>x.id===editor.id)){
      const i = listC.findIndex(x=>x.id===editor.id);
      listC[i] = {...listC[i], name, note:editor.note.trim(), items};
      saveCustomTemplates(listC);
    } else {
      listC.push({ id:"c"+Date.now(), name, note:editor.note.trim(),
        colorHex:pickColor(listC.length), items });
      saveCustomTemplates(listC);
    }
    editor = null;
    renderProgram();

/* ---- toplu GIF indirme: durdurulabilir, inmişleri atlar ---- */
let gifDlRunning = false, gifDlStop = false;
async function bulkDownload(list, btn, otherBtn, statEl){
  if(gifDlRunning){ gifDlStop = true; return }
  gifDlRunning = true; gifDlStop = false;
  const label = btn.innerHTML;
  if(otherBtn) otherBtn.disabled = true;
  let ok = 0, fail = 0, skip = 0;
  for(let i=0; i<list.length; i++){
    if(gifDlStop) break;
    btn.innerHTML = "■ Durdur — " + (i+1) + "/" + list.length +
      (fail ? " (" + fail + " hata)" : "");
    let had = null;
    try{ had = await mediaDB.get("gif_" + list[i].id) }catch(e){}
    if(had && had.blob){ skip++; continue }
    (await cacheGif(list[i])) ? ok++ : fail++;
    if(statEl && (i % 10 === 0)){
      const s = await mediaDB.gifStats();
      statEl.textContent = "İndirilen GIF: " + s.n + " adet · " + (s.bytes/1048576).toFixed(1) + " MB";
    }
    await sleep(150);
  }
  gifDlRunning = false; gifDlStop = false;
  if(otherBtn) otherBtn.disabled = false;
  btn.innerHTML = label;
  const s = await mediaDB.gifStats();
  if(statEl) statEl.textContent =
    "Son işlem: " + ok + " indirildi" + (skip ? ", " + skip + " zaten vardı" : "") +
    (fail ? ", " + fail + " başarısız" : "") +
    " · Toplam: " + s.n + " GIF · " + (s.bytes/1048576).toFixed(1) + " MB";
}
/* ---- cihazdaki GIF'leri dataURI olarak topla (gömme için) ---- */
async function collectCachedGifs(){
  try{
    const db = await mediaDB.open();
    return await new Promise(res=>{
      const st = db.transaction("gifs").objectStore("gifs");
      const map = {}; let n = 0, bytes = 0;
      const pend = [];
      const req = st.openCursor();
      req.onsuccess = ()=>{
        const c = req.result;
        if(!c){ Promise.all(pend).then(()=>res({ map, n, bytes })); return }
        const k = String(c.key);
        if(k.indexOf("gif_")===0 && c.value && c.value.blob){
          const id = k.slice(4), blob = c.value.blob;
          n++; bytes += blob.size || 0;
          pend.push(new Promise(r2=>{
            const fr = new FileReader();
            fr.onload = ()=>{ map[id] = fr.result; r2() };
            fr.onerror = ()=>r2();
            fr.readAsDataURL(blob);
          }));
        }
        c.continue();
      };
      req.onerror = ()=>res({ map, n:0, bytes:0 });
    });
  }catch(e){ return { map:{}, n:0, bytes:0 } }
}
/* ---- kataloğu (ve istenirse GIF'leri) dosyanın içine gömen yeni index.html üretir ---- */
async function makeEmbeddedFile(withGifs){
  let cat = (EMBEDDED_CATALOG && EMBEDDED_CATALOG.length) ? EMBEDDED_CATALOG : null;
  if(!cat){
    const cached = await mediaDB.get("__catalog_full");
    cat = cached && cached.items;
  }
  if(!cat || !cat.length){ alert("Önce kataloğu indir."); return }
  cat = dedupeItems(cat);
  let src;
  try{
    const r = await fetch(location.href, { cache:"no-store" });
    if(!r.ok) throw new Error("HTTP " + r.status);
    src = await r.text();
  }catch(e){
    alert("Sayfa kaynağı okunamadı. Bu özellik dosya GitHub Pages gibi bir sunucudan açıldığında çalışır (file:// ile çalışmaz).");
    return;
  }
  const M1 = "/*__PHT_" + "CATALOG__*/";
  const M2 = "/*__PHT_" + "CATALOG_END__*/";
  const i1 = src.indexOf(M1), i2 = src.indexOf(M2);
  if(i1 < 0 || i2 < 0 || i2 < i1){ alert("Yer tutucu bulunamadı; dosya değişmiş olabilir."); return }
  const json = JSON.stringify(cat).replace(/</g, "\\u003c");
  let out = src.slice(0, i1 + M1.length) + json + src.slice(i2);
  if(withGifs){
    const g = await collectCachedGifs();
    if(!g.n){ alert("Cihazda indirilmiş GIF yok. Önce 'Seçili' ya da 'TÜM GIF'leri indir' ile GIF indir."); return }
    const estMB = (out.length + g.bytes * 1.37) / 1048576;
    let msg = g.n + " GIF gömülecek. Tahmini dosya boyutu ~" + Math.round(estMB) + " MB.";
    if(estMB > 95) msg += "\n⚠ GitHub tek dosyada 100 MB sınırı koyar — bu dosya GitHub'a YÜKLENEMEYEBİLİR.";
    if(!confirm(msg + "\nDevam edilsin mi?")) return;
    const G1 = "/*__PHT_" + "GIFS__*/";
    const G2 = "/*__PHT_" + "GIFS_END__*/";
    const g1 = out.indexOf(G1), g2 = out.indexOf(G2);
    if(g1 < 0 || g2 < 0 || g2 < g1){ alert("GIF yer tutucusu bulunamadı."); return }
    const gjson = JSON.stringify(g.map).replace(/</g, "\\u003c");
    out = out.slice(0, g1 + G1.length) + gjson + out.slice(g2);
  }
  const blob = new Blob([out], { type:"text/html" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "index.html";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
  alert("Gömülü index.html indirildi (" + Math.round(out.length/1048576*10)/10 + " MB)" +
    (withGifs ? " — katalog + GIF'ler dahil." : " — yalnız katalog.") +
    " GitHub'daki index.html ile değiştir.");
}
/* ================= ANTRENMAN OYNATICI =================
   Gerçekçi 4 fazlı tempo + süper set akışı.
   Süper set: bağlı hareketler ardışık yapılır (kısa geçiş),
   dinlenme çift/tur tamamlanınca gelir. */
const player = {
  state:"idle", tplId:null, steps:[], stepIdx:0, rep:0,
  phaseMs:0, lastTs:0, paused:false, anim:null, raf:0,
  restLeft:0, restTotal:1, restLabel:"Dinlen", setsDone:0, startedAt:0,
  lastRestSec:-1, timedLeft:0, tempo:null, segIdx:-1, phase:0,
  prepped:{}, wcache:{}
};
const SS_TRANS = 5;   /* süper set içi geçiş süresi (sn) */
const SS_REST = 75;   /* süper set turu arası dinlenme (sn) */
const DEFAULT_TEMPO = [3,1,1,2];
/* Faz düzenleri: her hareketin doğal yönü farklıdır */
const PHASE_SETS = [
  { name:"⬇ İn · Bekle · Kalk  (squat, lunge…)",     f:["⬇ İn","⏸ Altta bekle","⬆ Kalk"] },
  { name:"⬆ Kaldır · Bekle · İndir  (curl, raise…)", f:["⬆ Kaldır","⏸ Üstte bekle","⬇ İndir"] },
  { name:"⬇ İndir · Bekle · İt  (press, şınav…)",    f:["⬇ İndir","⏸ Bekle","⬆ İt"] },
  { name:"◀ Çek · Bekle · Bırak  (row, çekişler…)",  f:["◀ Çek","⏸ Sık, bekle","▶ Bırak"] }
];
function autoPhase(ex){
  const n = " " + String(ex.rawName || ex.name || "").toLowerCase() + " ";
  if(/row|pulldown|pull down|face pull|pull apart|pullover|pull through|pull-through/.test(n)) return 3;
  if(/press|push|dip |dips|extension|pushdown|thruster/.test(n)) return 2;
  if(/curl|raise|shrug|pull-up|pull up|chin|upright|fly |flyes|lateral|swing|clean|snatch|thrust/.test(n)) return 1;
  return 0;
}
function tempoFor(item, ex){
  const raw = (store.get("pht_tempos") || {})[ex.id] || item.tempo || DEFAULT_TEMPO;
  const t = [0,1,2,3].map(i=>{
    const v = parseFloat(raw[i]);
    return isNaN(v) ? DEFAULT_TEMPO[i] : Math.max(0, Math.min(10, v));
  });
  if(t[0] + t[1] + t[2] < 0.5) return DEFAULT_TEMPO.slice();
  return t;
}
function saveTempo(exId, t){
  const all = store.get("pht_tempos") || {};
  all[exId] = t;
  store.set("pht_tempos", all);
}
function phaseFor(item, ex){
  const st = (store.get("pht_phases") || {})[ex.id];
  if(st !== undefined && st !== null) return Math.max(0, Math.min(PHASE_SETS.length - 1, st|0));
  if(item.phase !== undefined && item.phase !== null) return Math.max(0, Math.min(PHASE_SETS.length - 1, item.phase|0));
  return autoPhase(ex);
}
function savePhase(exId, p){
  const all = store.get("pht_phases") || {};
  all[exId] = p;
  store.set("pht_phases", all);
}
/* ---- süper set gruplama: it.ss = "sonraki hareketle bağlı" ---- */
function ssGroups(items){
  const groups = []; let i = 0;
  while(i < items.length){
    const g = [items[i]]; let j = i;
    while(items[j].ss && j + 1 < items.length){ j++; g.push(items[j]) }
    groups.push(g); i = j + 1;
  }
  return groups;
}
function groupTags(items){
  const tags = {}; let gi = 0;
  for(const g of ssGroups(items)){
    if(g.length > 1){
      const L = "ABCDEFGH"[gi % 8]; gi++;
      g.forEach((it, k)=>{ tags[items.indexOf(it)] = L + (k + 1) });
    }
  }
  return tags;
}
/* ---- şablon -> adım listesi ---- */
function buildSteps(tpl){
  const items = tpl.items.filter(it=>exById(it.ex));
  const steps = [];
  let gi = 0;
  for(const g of ssGroups(items)){
    if(g.length === 1){
      const it = g[0], ex = exById(it.ex);
      for(let s = 1; s <= it.sets; s++)
        steps.push({ item: it, ex, set: s, sets: it.sets, tag: "",
          rest: s < it.sets ? (ex.rest || 60) : 0, restLabel: "Dinlen" });
    } else {
      const L = "ABCDEFGH"[gi % 8]; gi++;
      const rounds = Math.max(...g.map(x=>x.sets));
      for(let r = 1; r <= rounds; r++){
        const active = g.filter(x=>r <= x.sets);
        active.forEach((it, k)=>{
          const lastInRound = k === active.length - 1;
          const lastRound = r === rounds;
          steps.push({ item: it, ex: exById(it.ex), set: r, sets: it.sets,
            tag: L + (g.indexOf(it) + 1),
            rest: lastInRound ? (lastRound ? 0 : SS_REST) : SS_TRANS,
            restLabel: lastInRound ? "Süper set arası dinlen" : "Geçiş → sıradaki hareket" });
        });
      }
    }
  }
  return steps;
}
const curTpl = ()=> tplById(player.tplId);
const curStep = ()=> player.steps[player.stepIdx];
const curItem = ()=> curStep().item;
const currentEx = ()=> curStep().ex;
function getWeight(exId){
  const w = store.get("pht_weights") || {};
  return w[exId] ? w[exId].last : null;
}
function saveWeight(exId, val){
  if(!val) return;
  const w = store.get("pht_weights") || {};
  const cur = w[exId] || { hist:[] };
  if(cur.last && cur.last !== val) cur.prev = cur.last;
  cur.last = val;
  cur.hist = (cur.hist||[]).concat([{d:new Date().toISOString().slice(0,10), v:val}]).slice(-10);
  w[exId] = cur;
  store.set("pht_weights", w);
}
function renderWorkout(){
  const v = document.getElementById("view-workout");
  if(player.anim){ player.anim.destroy(); player.anim = null }
  if(player.state==="idle"){
    if(!EXERCISES.length){
      v.innerHTML = `<div class="eyebrow">Antrenman</div>` + ctaHTML("Önce hareket kataloğunu indir");
      return;
    }
    const tpls = allTemplates();
    v.innerHTML = `
      <div class="eyebrow">Şablon seç ve başlat</div>
      ${tpls.map(t=>`
        <div class="daycard"><div class="dayhead">
          <div class="plate" style="border-color:${t.colorHex}"></div>
          <div class="t"><b>${esc(t.name)}</b><small>${t.items.length} hareket · ${t.builtin?"önerilen":"özel"}</small></div>
          <button class="startbig" data-t="${t.id}" style="width:auto;padding:10px 18px;margin:0;background:${t.colorHex};color:#fff">▶ Start</button>
        </div></div>`).join("")}
      <div class="hint">Her hareketin ağırlığı, temposu ve faz düzeni ilk hazırlık ekranında ayarlanır.
      🔗 Süper set bağlı hareketler ardışık yapılır (geçiş ${SS_TRANS} sn, tur arası ${SS_REST} sn).</div>`;
    v.querySelectorAll(".startbig").forEach(b=>b.addEventListener("click", e=>{
      e.stopPropagation();
      startProgram(b.dataset.t);
    }));
    return;
  }
  const tpl = curTpl();
  const st = curStep();
  if(!tpl || !st){ player.state = "idle"; renderWorkout(); return }
  const item = st.item, ex = st.ex;
  if(player.state==="prep"){
    const prevW = getWeight(ex.id);
    const tp = tempoFor(item, ex);
    const ph = phaseFor(item, ex);
    const P = PHASE_SETS[ph];
    v.innerHTML = `
      <div class="player-head">
        <b>${st.tag ? st.tag + " · " : ""}${esc(ex.name)}</b>
        <span class="setinfo">Hazırlık · adım ${player.stepIdx+1}/${player.steps.length}</span>
      </div>
      <div class="animbox big"><div class="animhost" id="playercv"></div></div>
      ${muscleCards(ex)}
      <div class="prepbox">
        <label>Ağırlık / ekipman (${ex.eq.join(" + ")})</label>
        <input id="p-weight" placeholder="örn. 12 kg · kırmızı bant" value="${esc(prevW||"")}" autocomplete="off">
        <div class="prevref">${prevW ? `Geçen sefer: <b>${esc(prevW)}</b>` : "İlk kayıt — bugünkü ağırlığını gir"}</div>
      </div>
      ${item.timed ? "" : `
      <div class="prepbox">
        <label>Faz düzeni — hareket nasıl başlıyor?</label>
        <select id="p-phase">${PHASE_SETS.map((pp,i)=>`<option value="${i}" ${i===ph?"selected":""}>${pp.name}</option>`).join("")}</select>
        <label style="margin-top:10px">Tempo (saniye)</label>
        <div class="temporow">
          <span>${P.f[0]}</span><input class="mini" id="tp0" inputmode="decimal" value="${tp[0]}">
          <span>${P.f[1]}</span><input class="mini" id="tp1" inputmode="decimal" value="${tp[1]}">
          <span>${P.f[2]}</span><input class="mini" id="tp2" inputmode="decimal" value="${tp[2]}">
          <span>Ara</span><input class="mini" id="tp3" inputmode="decimal" value="${tp[3]}">
        </div>
        <div class="prevref">Bu harekete kaydedilir; GIF de bu ritimle eşzamanlı oynar.</div>
      </div>`}
      <div class="pctl">
        <button class="btn ghost small" id="p-how">Nasıl?</button>
        <button class="btn primary" id="p-ready">✔ Ready — Başla</button>
        <button class="btn danger small" id="p-end">■ End</button>
      </div>
      <div class="hint">${item.sets} set × ${item.reps}${item.timed ? " saniye" : " tekrar"}${st.tag ? " · Süper set üyesi (" + st.tag + ")" : ""}</div>`;
    player.anim = createAnim(document.getElementById("playercv"), ex);
    const inp = document.getElementById("p-weight");
    const phSel = document.getElementById("p-phase");
    if(phSel) phSel.addEventListener("change", ()=>{
      savePhase(ex.id, parseInt(phSel.value, 10) || 0);
      renderWorkout();
    });
    const readTempo = ()=>{
      const e0 = document.getElementById("tp0");
      if(!e0) return;
      const t = [0,1,2,3].map(i=>{
        const vv = parseFloat(document.getElementById("tp"+i).value.replace(",","."));
        return isNaN(vv) ? DEFAULT_TEMPO[i] : Math.max(0, Math.min(10, vv));
      });
      saveTempo(ex.id, t);
    };
    ["tp0","tp1","tp2","tp3"].forEach(idd=>{
      const el = document.getElementById(idd);
      if(el) el.addEventListener("change", readTempo);
    });
    const goReady = ()=>{
      readTempo();
      const wv = inp.value.trim();
      saveWeight(ex.id, wv);
      player.wcache[ex.id] = wv || getWeight(ex.id) || "";
      player.prepped[ex.id] = true;
      gotoWork();
    };
    document.getElementById("p-ready").addEventListener("click", goReady);
    inp.addEventListener("keydown", e=>{ if(e.key==="Enter") goReady() });
    document.getElementById("p-how").addEventListener("click", ()=>openSheet(ex.id));
    document.getElementById("p-end").addEventListener("click", ()=>{
      if(confirm("Antrenman bitirilsin ve kaydedilsin mi?")) endProgram();
    });
    return;
  }
  /* work / rest: tam ekran gif + rozet + faz satırı */
  v.innerHTML = `
    <div class="player-head">
      <b>${st.tag ? st.tag + " · " : ""}${esc(ex.name)}</b>
      <span class="setinfo" id="p-setinfo"></span>
    </div>
    <div class="animbox big"><div class="animhost" id="playercv"></div>
      <div class="repbadge" id="p-rep"></div>
    </div>
    <div class="pline" id="p-line">–</div>
    <div class="pbar"><div id="p-bar"></div></div>
    <div class="pctl">
      <button class="btn ghost small" id="p-how">Nasıl?</button>
      <button class="btn primary" id="p-pause">⏸ Pause</button>
      <button class="btn ghost small" id="p-skip">Geç ›</button>
      <button class="btn danger small" id="p-end">■ End</button>
    </div>`;
  player.anim = createAnim(document.getElementById("playercv"), ex);
  document.getElementById("p-how").addEventListener("click", ()=>{ setPaused(true); openSheet(ex.id) });
  document.getElementById("p-pause").addEventListener("click", ()=>setPaused(!player.paused));
  document.getElementById("p-skip").addEventListener("click", skipStep);
  document.getElementById("p-end").addEventListener("click", ()=>{
    if(confirm("Antrenman bitirilsin ve kaydedilsin mi?")) endProgram();
  });
}
function gotoWork(){
  const st = curStep(), item = st.item, ex = st.ex;
  player.rep = 0; player.phaseMs = 0; player.segIdx = -1;
  player.timedLeft = item.timed ? item.reps * 1000 : 0;
  player.tempo = tempoFor(item, ex).map(sn=>sn*1000);
  player.phase = phaseFor(item, ex);
  player.state = "work";
  player.lastTs = performance.now();
  beep(660,.12,.1);
  renderWorkout();
}
function startProgram(tplId){
  const tpl = tplById(tplId);
  if(!tpl) return;
  const steps = buildSteps(tpl);
  if(!steps.length){ alert("Bu şablonda çalıştırılabilir hareket yok."); return }
  Object.assign(player, { state:"prep", tplId, steps, stepIdx:0, rep:0,
    phaseMs:0, lastTs:performance.now(), paused:false, restLeft:0, restTotal:1,
    setsDone:0, startedAt:Date.now(), lastRestSec:-1, segIdx:-1,
    prepped:{}, wcache:{} });
  renderWorkout();
  cancelAnimationFrame(player.raf);
  player.raf = requestAnimationFrame(playerLoop);
}
function setPaused(p){
  player.paused = p;
  if(player.anim) player.anim.paused = p;
  const b = document.getElementById("p-pause");
  if(b) b.textContent = p ? "▶ Devam" : "⏸ Pause";
  if(!p) player.lastTs = performance.now();
}
function advanceSet(){
  player.setsDone++;
  beep(880,.18,.12); if(navigator.vibrate) navigator.vibrate(150);
  const done = curStep();
  if(player.stepIdx >= player.steps.length - 1){ finishProgram(); return }
  player.stepIdx++;
  const next = curStep();
  if(!player.prepped[next.ex.id]){
    /* yeni hareket ilk kez: ağırlık/tempo hazırlığı (geçiş süresi yerine geçer) */
    player.state = "prep";
    renderWorkout();
    return;
  }
  if(done.rest > 0){
    player.state = "rest";
    player.restTotal = done.rest * 1000;
    player.restLeft = player.restTotal;
    player.restLabel = done.restLabel || "Dinlen";
    player.lastRestSec = -1;
    renderWorkout(); /* sıradaki adımın hareketi ekranda, GIF serbest oynar */
  } else {
    gotoWork();
  }
}
function afterRest(){ gotoWork() }
function skipStep(){
  if(player.state==="work"){ advanceSet(); player.lastTs = performance.now() }
  else if(player.state==="rest"){ player.restLeft = 0 }
}
function finishProgram(){
  saveSession(true);
  cancelAnimationFrame(player.raf);
  const done = player.setsDone;
  if(player.anim){ player.anim.destroy(); player.anim = null }
  player.state = "idle";
  const v = document.getElementById("view-workout");
  v.innerHTML = `<div class="empty" style="padding:60px 20px">
    <div style="font-size:44px">💪</div>
    <b style="color:var(--text);font-size:18px">Antrenman tamamlandı!</b><br>
    ${done} set bitirdin. Kayıt Geçmiş'e eklendi.</div>
    <button class="btn primary" style="width:100%" id="p-done">Tamam</button>`;
  document.getElementById("p-done").addEventListener("click", ()=>switchView("history"));
}
function endProgram(){
  saveSession(false);
  cancelAnimationFrame(player.raf);
  if(player.anim){ player.anim.destroy(); player.anim = null }
  player.state = "idle";
  renderWorkout();
}
function saveSession(full){
  const tpl = curTpl();
  if(!tpl) return;
  const sessions = store.get("pht_sessions") || [];
  sessions.unshift({
    tplName: tpl.name, colorHex: tpl.colorHex,
    date: new Date().toISOString(),
    mins: Math.max(1, Math.round((Date.now()-player.startedAt)/60000)),
    sets: player.setsDone, totalSets: player.steps.length, full
  });
  store.set("pht_sessions", sessions);
}
function playerLoop(now){
  try{ playerLoopInner(now) }
  catch(err){
    showErr("playerLoop: " + (err && err.message) + (err && err.stack ? " | " + String(err.stack).split("\n")[1] : ""));
    player.raf = requestAnimationFrame(playerLoop);
  }
}
function playerLoopInner(now){
  if(player.state==="idle") return;
  const dt = player.paused ? 0 : Math.min(100, now - player.lastTs);
  player.lastTs = now;
  if(player.state==="prep"){
    player.raf = requestAnimationFrame(playerLoop);
    return;
  }
  const st = curStep();
  if(!st){ endProgram(); return }
  const item = st.item, ex = st.ex;
  const setInfo = document.getElementById("p-setinfo");
  const lineEl = document.getElementById("p-line");
  const barEl = document.getElementById("p-bar");
  const repEl = document.getElementById("p-rep");
  const wv = player.wcache[ex.id];
  const wTag = wv ? " · " + wv : "";
  const tagTxt = st.tag ? st.tag + " · " : "";
  if(player.state==="work"){
    if(setInfo) setInfo.textContent = `${tagTxt}Set ${st.set}/${st.sets}${wTag}`;
    if(item.timed){
      player.timedLeft -= dt;
      const s = Math.max(0, Math.ceil(player.timedLeft/1000));
      if(repEl) repEl.style.display = "none";
      if(lineEl){
        lineEl.textContent = ("Pozisyonu koru · 0:" + String(s).padStart(2,"0")).toLocaleUpperCase("tr");
        lineEl.className = "pline";
      }
      if(barEl) barEl.style.width = (100*(1 - player.timedLeft/(item.reps*1000))) + "%";
      if(player.timedLeft <= 0){ advanceSet() }
      player.raf = requestAnimationFrame(playerLoop);
      return;
    }
    const T = player.tempo || [3000,1000,1000,2000];
    const move = T[0] + T[1] + T[2], cycle = move + T[3];
    player.phaseMs += dt;
    let t = player.phaseMs;
    if(t >= cycle){ player.phaseMs -= cycle; t = player.phaseMs; player.segIdx = -1 }
    let seg;
    if(t < T[0]) seg = 0;
    else if(t < T[0] + T[1]) seg = 1;
    else if(t < move) seg = 2;
    else seg = 3;
    if(seg !== player.segIdx){
      player.segIdx = seg;
      if(seg === 0 && T[0] > 0) beep(392,.05,.07);
      if(seg === 1 && T[1] > 0) beep(523,.05,.07);
      if(seg === 2 && T[2] > 0) beep(784,.05,.08);
      if(seg === 3){
        player.rep++;
        beep(520,.06,.09);
        if(player.rep >= item.reps){
          advanceSet();
          player.phaseMs = 0; player.segIdx = -1;
        }
      }
    }
    if(player.state==="work"){
      if(player.anim && player.anim.drive)
        player.anim.drive(seg === 3 ? 0 : Math.min(1, t / move));
      const P = PHASE_SETS[player.phase] || PHASE_SETS[0];
      const ends = [T[0], T[0] + T[1], move, cycle];
      const rem = Math.max(1, Math.ceil((ends[seg] - t) / 1000));
      const repShow = Math.min(player.rep + (seg === 3 ? 0 : 1), item.reps);
      let txt;
      if(seg === 3) txt = ""; /* tekrar arası: ekran boş, süre dolunca ilk komut döner */
      else txt = T[seg] <= 1200 ? P.f[seg] + "!" : P.f[seg] + " · " + rem;
      if(lineEl){ lineEl.textContent = txt ? txt.toLocaleUpperCase("tr") : ""; lineEl.className = "pline" }
      if(repEl){ repEl.style.display = ""; repEl.textContent = repShow + "/" + item.reps }
      if(barEl){
        const frac = seg === 3 ? 0 : Math.min(t, move) / move;
        barEl.style.width = (100 * Math.min(1, (player.rep + frac) / item.reps)) + "%";
      }
    }
  }
  if(player.state==="rest"){
    if(player.anim && player.anim.release) player.anim.release();
    if(repEl) repEl.style.display = "none";
    player.restLeft -= dt;
    const s = Math.max(0, Math.ceil(player.restLeft/1000));
    if(s !== player.lastRestSec){
      player.lastRestSec = s;
      if(s <= 5 && s > 0){ beep(740,.08,.1); if(navigator.vibrate) navigator.vibrate(60) }
    }
    if(setInfo) setInfo.textContent = `${tagTxt}Sıradaki: Set ${st.set}/${st.sets}${wTag}`;
    if(lineEl){
      const mm = `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
      lineEl.textContent = (s <= 5 ? `HAZIRLAN! · ${mm}` : `${player.restLabel} · ${mm}`).toLocaleUpperCase("tr");
      lineEl.className = s <= 5 ? "pline warn" : "pline";
    }
    if(barEl) barEl.style.width = (100*(1 - player.restLeft/player.restTotal)) + "%";
    if(player.restLeft <= 0){
      beep(660,.15,.12); if(navigator.vibrate) navigator.vibrate([120,80,120]);
      afterRest();
    }
  }
  player.raf = requestAnimationFrame(playerLoop);
}
/* ---- geçmiş ---- */
function renderHistory(){
  const v = document.getElementById("view-history");
  const sessions = store.get("pht_sessions") || [];
  if(sessions.length===0){
    v.innerHTML = `<div class="eyebrow">Geçmiş</div>
      <div class="empty">Henüz kayıtlı seans yok.<br>Antrenman sekmesinden Start'a bas.</div>`;
    return;
  }
  const fmt = iso => new Date(iso).toLocaleDateString("tr-TR",{day:"numeric",month:"long",weekday:"short"});
  v.innerHTML = `
    <div class="eyebrow">Geçmiş — ${sessions.length} seans</div>
    ${sessions.map(s=>`<div class="hcard">
        <div class="hd"><b style="color:${s.colorHex||"#efa33a"}">${esc(s.tplName||"Antrenman")}${s.full?"":" (yarım)"}</b><small>${fmt(s.date)}</small></div>
        <div class="st">${s.sets}/${s.totalSets} set · ${s.mins} dk</div>
      </div>`).join("")}`;
}
/* ================= NAVİGASYON ================= */
const VIEWS = ["program","library","workout","history","settings"];
function switchView(name){
  closeSheet();
  if(name!=="workout" && player.state!=="idle"){ setPaused(true) }
  VIEWS.forEach(vn=>{
    document.getElementById("view-"+vn).classList.toggle("hidden", vn!==name);
    document.getElementById("nav-"+vn).classList.toggle("on", vn===name);
  });
  if(name==="program") renderProgram();
  if(name==="library") renderLibrary();
  if(name==="workout" && player.state==="idle") renderWorkout();
  if(name==="history") renderHistory();
  if(name==="settings") renderSettings();
}
VIEWS.forEach(vn=>document.getElementById("nav-"+vn).addEventListener("click",()=>switchView(vn)));
if(EMBEDDED_CATALOG && EMBEDDED_CATALOG.length) buildExercises(EMBEDDED_CATALOG);
renderProgram();
renderWorkout();
/* cihazda daha büyük (indirilen) bir katalog varsa onu kullan */
mediaDB.get("__catalog_full").then(c=>{
  if(c && c.items && dedupeItems(c.items).length > EXERCISES.length){
    buildExercises(c.items);
    renderProgram(); renderWorkout();
  }
}).catch(()=>{});

</script>
